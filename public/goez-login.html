<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登入｜Goez Shop 後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Noto Sans TC', 'sans-serif'] },
          boxShadow: {
            'soft': '0 2px 12px rgba(0,0,0,0.06)',
            'soft-lg': '0 4px 20px rgba(0,0,0,0.08)',
          },
        },
      },
    }
  </script>
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
    .page-enter {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 320ms ease, transform 320ms ease;
    }
    .page-enter.is-entered {
      opacity: 1;
      transform: translateY(0);
    }
    @media (prefers-reduced-motion: reduce) {
      .page-enter {
        opacity: 1;
        transform: none;
        transition: none;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <div class="flex flex-col min-h-screen">
    <!-- Topbar -->
    <header class="flex-shrink-0 bg-gradient-to-r from-slate-200 via-slate-100 to-blue-100/80 backdrop-blur-sm">
      <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <a href="../index.html" class="flex items-center gap-2">
            <span class="text-xl font-bold text-slate-800 tracking-tight">Goez Shop</span>
          </a>
          <div class="flex items-center gap-3">
            <label for="lang-switch" class="sr-only" data-i18n="language">語言</label>
            <select id="lang-switch" class="text-sm rounded-xl border border-slate-200 bg-white/80 px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-200"></select>
          </div>
        </div>
      </div>
    </header>

    <!-- Main -->
    <main class="flex-1">
      <div class="page-enter max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10 lg:py-14">
        <div class="mb-8">
          <h1 class="text-2xl sm:text-3xl font-bold text-slate-900" data-i18n="signinTitle">登入 Goez Shop</h1>
          <p class="mt-2 text-sm text-slate-600" data-i18n="signinSubtitle">輸入帳號與密碼，進入後台管理你的店鋪。</p>
        </div>

        <section class="bg-white rounded-2xl shadow-soft overflow-hidden">
          <div class="p-6 sm:p-8">
            <form id="signin-form" class="space-y-4" novalidate>
              <div>
                <label for="signin-email" class="block text-sm font-medium text-slate-700 mb-1.5" data-i18n="email">Email</label>
                <input
                  type="email"
                  id="signin-email"
                  required
                  placeholder="example@email.com"
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:border-slate-300 focus:ring-2 focus:ring-slate-200 focus:outline-none text-slate-800 placeholder-slate-400 transition"
                />
              </div>

              <div>
                <label for="signin-password" class="block text-sm font-medium text-slate-700 mb-1.5" data-i18n="password">密碼</label>
                <div class="relative flex items-center">
                    <input
                    type="password"
                    id="signin-password"
                    required
                    placeholder="請輸入密碼"
                    data-i18n-placeholder="passwordPlaceholder"
                    class="w-full px-4 py-3 pr-11 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:border-slate-300 focus:ring-2 focus:ring-slate-200 focus:outline-none text-slate-800 placeholder-slate-400 transition"
                    />
                    <!-- 👁️ 切換密碼顯示按鈕 -->
                    <button
                    type="button"
                    id="toggle-password"
                    class="absolute right-3 p-1.5 text-slate-400 hover:text-slate-600 focus:outline-none transition"
                    aria-label="切換密碼顯示"
                    >
                    <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                    </button>
                </div>
              </div>

              <div id="signin-error" class="hidden p-3 rounded-xl border border-red-200 bg-red-50 text-red-700 text-sm"></div>

              <div class="flex flex-wrap justify-end gap-3 pt-2">
                <button
                  type="submit"
                  class="px-5 py-3 rounded-xl bg-slate-800 text-white font-medium shadow-soft hover:bg-slate-900 transition whitespace-nowrap"
                  data-i18n="signin"
                >
                  登入
                </button>
              </div>
              <p class="pt-2 text-sm text-slate-600 text-right">
                <span data-i18n="noAccount">還沒有帳號？</span>
                <a href="./goez-register.html" class="font-medium text-slate-800 hover:text-slate-900 underline underline-offset-2" data-i18n="createAccount">建立帳號</a>
              </p>
            </form>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="./login/i18n-core.js"></script>
  <script src="./login/i18n.js"></script>
  <script>
    // 頁面淡入效果
    (function () {
      var entering = document.querySelector('.page-enter');
      if (!entering) return;
      requestAnimationFrame(function () {
        entering.classList.add('is-entered');
      });
    })();

    // 表單驗證與密碼切換邏輯
    (function () {
      var form = document.getElementById('signin-form');
      var email = document.getElementById('signin-email');
      var password = document.getElementById('signin-password');
      var errorBox = document.getElementById('signin-error');
      if (!form || !email || !password || !errorBox) return;

      var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      // 👁️ 【你問的部分放這裡】密碼顯示/隱藏切換
      var togglePasswordBtn = document.getElementById('toggle-password');
      var eyeIcon = document.getElementById('eye-icon');

      if (togglePasswordBtn && password) {
        togglePasswordBtn.addEventListener('click', function () {
          var isPassword = password.getAttribute('type') === 'password';
          password.setAttribute('type', isPassword ? 'text' : 'password');

          if (isPassword) {
            eyeIcon.innerHTML = `
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.018 10.018 0 013.682-.563c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m-1.785-1.785a3 3 0 01-4.243-4.243M3 3l18 18" />
            `;
          } else {
            eyeIcon.innerHTML = `
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            `;
          }
        });
      }

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove('hidden');
      }

      function clearError() {
        errorBox.textContent = '';
        errorBox.classList.add('hidden');
      }

      // 打字時自動隱藏錯誤提示
      email.addEventListener('input', clearError);
      password.addEventListener('input', clearError);

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearError();

        var emailVal = email.value.trim();
        var passwordVal = password.value.trim();

        // 1. 空值檢查
        if (!emailVal || !passwordVal) {
          showError(GoezI18n.t('errSigninEmpty') || '請輸入帳號與密碼');
          return;
        }

        // 2. Email 格式檢查
        if (!emailRegex.test(emailVal)) {
          showError(GoezI18n.t('errInvalidEmail') || '請輸入有效的 Email 格式');
          return;
        }

        // 🚀 3. 發送 API 請求給後端 Express
        try {
          var response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              email: emailVal,
              password: passwordVal
            })
          });

          var data = await response.json();

          if (response.ok && data.success) {
            // 1.登入成功：保存 Token 與賣家資訊至 localStorage
            if (data.token) localStorage.setItem('sellerToken', data.token);
            if (data.seller) {
                localStorage.setItem('sellerInfo', JSON.stringify(data.seller));
                
                // 💡 依照你的 Seller 模型定義，精準抓取 SellerID 存起來！
                if (data.seller.SellerID) {
                    localStorage.setItem('sellerId', data.seller.SellerID);
                }
            }

            // 2. 自動導頁至首頁，並把 SellerID 帶在網址後綴傳過去
            // 請把 'goez-home.html' 換成你們實際的首頁檔名
            var sellerId = (data.seller && data.seller.SellerID) ? data.seller.SellerID : 1;
            window.location.href = `goez-home.html?sellerId=${sellerId}`;
          } else {
            // 3.登入失敗：顯示後端回傳的錯誤訊息
            showError(data.message || '登入失敗，請檢查帳號密碼');
          }
        } catch (err) {
          console.error('登入 API 呼叫失敗:', err);
          showError('網路連線異常，請稍後再試');
        }
      });

      GoezI18n.mountSwitcher(document.getElementById('lang-switch'), function () {
        document.title = GoezI18n.t('pageTitleSignin');
        clearError();
      });
      GoezI18n.apply();
      document.title = GoezI18n.t('pageTitleSignin');
    })();
  </script>
</body>
</html>
