<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>查詢訂單｜Goez Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Noto Sans TC', 'sans-serif'] },
          boxShadow: {
            soft: '0 2px 12px rgba(0,0,0,0.06)',
            'soft-lg': '0 4px 20px rgba(0,0,0,0.08)',
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
    .page-enter {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 320ms ease, transform 320ms ease;
    }
    .page-enter.is-entered {
      opacity: 1;
      transform: translateY(0);
    }
    @media (prefers-reduced-motion: reduce) {
      .page-enter { opacity: 1; transform: none; transition: none; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <div class="flex flex-col min-h-screen">
    <header class="flex-shrink-0 bg-gradient-to-r from-slate-200 via-slate-100 to-blue-100/80 backdrop-blur-sm">
      <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <!-- 返回前台按鈕 -->
          <a href="#" id="backToStoreBtn" class="px-4 py-2 rounded-lg bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-medium transition-colors flex items-center gap-1 shadow-sm" data-i18n="backToStoreBtn">
            &larr; 返回賣場
          </a>
        </div>
      </div>
    </header>

    <main class="flex-1">
      <div class="page-enter max-w-lg mx-auto px-4 sm:px-6 py-8 lg:py-12">
        <div class="text-center mb-8">
          <h1 class="text-2xl sm:text-3xl font-bold text-slate-900" data-i18n="lookupHeading">查詢訂單</h1>
          <p class="mt-2 text-sm text-slate-600" data-i18n="lookupInterval">可查詢區間：6 個月內</p>
        </div>

        <section class="bg-white rounded-2xl shadow-soft border border-slate-100 p-6 sm:p-8">
          <form id="order-lookup-form" class="space-y-5" novalidate>
            <div>
              <label for="lookup-order-id" class="block text-sm font-medium text-slate-700 mb-1.5">
                <span data-i18n="orderIdLabel">訂單編號</span> <span class="text-rose-600 text-xs font-normal" data-i18n="requiredTag">必填</span>
              </label>
              <input
                type="text"
                id="lookup-order-id"
                inputmode="numeric"
                required
                placeholder="例：99999"
                data-i18n-placeholder="orderIdPlaceholder"
                class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:border-slate-300 focus:ring-2 focus:ring-slate-200 focus:outline-none text-slate-800 placeholder-slate-400 transition"
              />
            </div>

            <div>
              <label for="lookup-phone" class="block text-sm font-medium text-slate-700 mb-1.5">
                <span data-i18n="phoneLabel">聯絡電話</span> <span class="text-rose-600 text-xs font-normal" data-i18n="requiredTag">必填</span>
              </label>
              <input
                type="tel"
                id="lookup-phone"
                required
                placeholder="0987654321"
                data-i18n-placeholder="phonePlaceholder"
                class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:border-slate-300 focus:ring-2 focus:ring-slate-200 focus:outline-none text-slate-800 placeholder-slate-400 transition"
              />
              <p class="mt-2 text-xs text-slate-500" data-i18n="phoneHint">請輸入下單時填寫的聯絡電話。</p>
            </div>

            <div id="lookup-error" class="hidden p-3 rounded-xl border border-red-200 bg-red-50 text-red-700 text-sm" role="alert"></div>

            <button
              type="submit"
              class="w-full px-5 py-3.5 rounded-xl bg-slate-800 text-white font-medium shadow-soft hover:bg-slate-900 transition"
              data-i18n="lookupBtn"
            >
              查詢
            </button>
          </form>
        </section>

        <!-- 示範資料卡片 -->
        <div class="mt-6 rounded-xl border border-dashed border-slate-300 bg-white/80 p-4 sm:p-5">
          <p class="text-sm font-medium text-slate-800" data-i18n="demoTitle">虛擬示範訂單</p>
          <div class="mt-4 rounded-xl border border-dashed border-slate-300 bg-white/80 p-4 sm:p-5">
            <p class="text-sm font-medium text-slate-800" data-i18n="demoCompleted">訂單已完成</p>
            <p class="mt-1 text-xs text-slate-600 leading-relaxed">
              <span data-i18n="demoOrderIdLabel">訂單編號</span> <span class="font-mono font-medium text-slate-800">10032</span> ·
              <span data-i18n="demoPhoneLabel">電話</span> <span class="font-mono font-medium text-slate-800">+886912345678</span>
            </p>
          </div>
          <div class="mt-4 rounded-xl border border-dashed border-slate-300 bg-white/80 p-4 sm:p-5">
            <p class="text-sm font-medium text-slate-800" data-i18n="demoUnpaid">未付款</p>
            <p class="mt-1 text-xs text-slate-600 leading-relaxed">
              <span data-i18n="demoOrderIdLabel">訂單編號</span> <span class="font-mono font-medium text-slate-800">10041</span> ·
              <span data-i18n="demoPhoneLabel">電話</span> <span class="font-mono font-medium text-slate-800">+886912345678</span>
            </p>
          </div>
          <div class="mt-4 rounded-xl border border-dashed border-slate-300 bg-white/80 p-4 sm:p-5">
            <p class="text-sm font-medium text-slate-800" data-i18n="demoPendingShipment">待出貨</p>
            <p class="mt-1 text-xs text-slate-600 leading-relaxed">
              <span data-i18n="demoOrderIdLabel">訂單編號</span> <span class="font-mono font-medium text-slate-800">10086</span> ·
              <span data-i18n="demoPhoneLabel">電話</span> <span class="font-mono font-medium text-slate-800">+886912345678</span>
            </p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="./js/demo-orders.js"></script>
  <!-- 🌟 引入核心與查詢頁字典檔 -->
  <script src="./i18n/i18n-core.js"></script>
  <script src="./i18n/buyerOrder.js"></script>

  <script>
    (function () {
      function t(key, fallback) {
        return (window.GoezI18n && GoezI18n.t(key)) ? GoezI18n.t(key) : fallback;
      }

      // 自動套用當前語系
      if (window.GoezI18n) {
        GoezI18n.apply();
        document.title = GoezI18n.t('pageTitleBuyerOrder');
      }

      var form = document.getElementById('order-lookup-form');
      var orderIdInput = document.getElementById('lookup-order-id');
      var phoneInput = document.getElementById('lookup-phone');
      var lookupError = document.getElementById('lookup-error');

      function showLookupError(msg) {
        lookupError.textContent = msg;
        lookupError.classList.remove('hidden');
      }
      function clearLookupError() {
        lookupError.textContent = '';
        lookupError.classList.add('hidden');
      }

      // ✨ 查詢送出事件：改為非同步預先驗證（驗證成功才跳轉，失敗留在原頁報錯）
      function submitLookup() {
        clearLookupError();
        
        var idValue = orderIdInput.value.trim();
        var phoneValue = phoneInput.value.trim();

        // 1. 基本防禦性檢查
        if (!idValue) {
          showLookupError(t('errInputOrderId', '請輸入訂單編號'));
          return;
        }
        if (!phoneValue) {
          showLookupError(t('errInputPhone', '請輸入手機號碼'));
          return;
        }

        console.log('🔍 買家送出查詢，正在連線後端預先驗證... 編號:', idValue, '電話:', phoneValue);

        // 2. ✨ 發送 fetch 向後端驗證編號與手機
        var verifyUrl = '/api/orders/' + encodeURIComponent(idValue) + '?phone=' + encodeURIComponent(phoneValue);

        fetch(verifyUrl)
          .then(function (res) {
            if (!res.ok) {
              throw new Error(t('errNotFound', '查無此訂單，請確認訂單編號與手機號碼是否正確'));
            }
            return res.json();
          })
          .then(function (data) {
            console.log('✅ 驗證成功，正在跳轉至詳情頁...');
            // 3. 🎯 帶著 orderId 與 phone 參數跳轉至訂單詳情頁
            var currentParams = new URLSearchParams(window.location.search);
            var fromUrl = currentParams.get('from');

            var detailUrl = 'goez-buyerOrder-detail.html?orderId=' + encodeURIComponent(idValue) + '&phone=' + encodeURIComponent(phoneValue);
            if (fromUrl) {
                detailUrl += '&from=' + encodeURIComponent(fromUrl);
            }

            window.location.href = detailUrl;
          })
          .catch(function (err) {
            console.warn('❌ 驗證失敗，停留在本頁:', err.message);
            // 4. 🎯 留在本頁顯示紅字錯誤提示，不進行跳轉
            showLookupError(err.message || t('errNotFound', '查無此訂單，請確認訂單編號與手機號碼是否正確'));
          });
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        submitLookup();
      });

      // 支援 demo 測試參數
      if (new URLSearchParams(window.location.search).get('demo') === '1') {
        orderIdInput.value = '14';
        phoneInput.value = '0912345678';
        submitLookup();
      }

      requestAnimationFrame(function () {
        var pageEnter = document.querySelector('.page-enter');
        if (pageEnter) pageEnter.classList.add('is-entered');
      });

      // ==========================================
      // ✨ 自動帶回原本賣場的返回按鈕邏輯
      // ==========================================
      const urlParams = new URLSearchParams(window.location.search);
      const backUrl = urlParams.get('from');
      const backBtn = document.getElementById('backToStoreBtn');

      if (backBtn) {
        if (backUrl) {
          backBtn.href = decodeURIComponent(backUrl);
        } else {
          backBtn.href = "goez-store-template.html"; 
        }
      }

    })();
  </script>
</body>
</html>
