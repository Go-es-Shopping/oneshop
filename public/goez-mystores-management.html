<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理已建立賣場 — Goez Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+SC:wght@400&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --color-white: #ffffff;
      --color-black: #000000;
      --color-black-55: rgba(0, 0, 0, 0.55);
      --color-black-10: rgba(0, 0, 0, 0.1);
      --color-black-5: rgba(0, 0, 0, 0.05);
      --color-green: #1e7e42;
      --color-green-bg: #eafaf0;
      --color-grey: #6a7282;
      --color-grey-bg: #f3f4f6;
      --color-red: #c0392b;
      --color-red-bg: #fdecea;

      --fs-32: 32px;
      --fs-20: 20px;
      --fs-18: 18px;
      --fs-16: 16px;
      --fs-14: 14px;
      --fs-13: 13px;

      --fw-regular: 400;
      --fw-medium: 500;
      --fw-semibold: 600;
      --fw-bold: 700;

      --lh-heading: 1.2;
      --lh-body: 1.45;

      --ls-heading: -0.6px;

      --radius-16: 16px;
      --radius-12: 12px;
      --radius-10: 10px;
      --radius-full: 9999px;

      --shadow-card: 0px 4px 8px 0px rgba(0, 0, 0, 0.02), 0px 6px 12px 0px rgba(0, 0, 0, 0.03);

      --spacing-64: 64px;
      --spacing-48: 48px;
      --spacing-40: 40px;
      --spacing-32: 32px;
      --spacing-24: 24px;
      --spacing-16: 16px;
      --spacing-12: 12px;
      --spacing-8: 8px;
      --spacing-4: 4px;

      --font-primary: 'Inter', 'Noto Sans JP', 'Noto Sans SC', sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
    }

    body {
      font-family: var(--font-primary);
      background: var(--color-white);
      color: var(--color-black);
      min-height: 100vh;
    }

    p,
    h1,
    h2 {
      margin: 0;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    /* ─── Top bar（改用 Background.svg 當底圖） ─────────────────── */
    .topbar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 96px;
      padding: 0 var(--spacing-40);
      overflow: hidden;
      width: 100%;
    }

    .topbar__bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .topbar__brand {
      position: relative;
      z-index: 1;
      font-size: var(--fs-20);
      font-weight: var(--fw-bold);
      letter-spacing: var(--ls-heading);
      color: var(--color-white);
    }

    .topbar__logout {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-12);
      padding: var(--spacing-8) var(--spacing-16);
      font-size: var(--fs-16);
      font-weight: var(--fw-medium);
      color: var(--color-white);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .topbar__logout:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.4);
    }

    /* ─── Page ──────────────────────────────────────────────────── */
    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: var(--spacing-48) var(--spacing-24) var(--spacing-64);
    }

    .breadcrumb {
      display: inline-block;
      font-size: var(--fs-14);
      font-weight: var(--fw-medium);
      color: var(--color-black-55);
      margin-bottom: var(--spacing-24);
      transition: color 0.2s ease;
    }

    .breadcrumb:hover {
      color: var(--color-black);
    }

    .page__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--spacing-16);
      margin-bottom: var(--spacing-32);
      flex-wrap: wrap;
    }

    .page__title-group {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-4);
    }

    .page__title {
      font-size: var(--fs-32);
      font-weight: var(--fw-bold);
      line-height: var(--lh-heading);
      letter-spacing: var(--ls-heading);
    }

    .page__subtitle {
      font-size: var(--fs-16);
      font-weight: var(--fw-medium);
      color: var(--color-black-55);
    }

    .btn--dark {
      background: var(--color-black);
      color: var(--color-white);
      border: none;
      padding: var(--spacing-12) var(--spacing-20, 20px);
      border-radius: var(--radius-12);
      font-size: var(--fs-16);
      font-weight: var(--fw-medium);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-8);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn--dark:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      background: #222;
    }

    .btn--dark:active {
      transform: translateY(0);
    }

    /* ─── Store list ────────────────────────────────────────────── */
    .store-list {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-16);
    }

    .store-card {
      display: flex;
      align-items: center;
      gap: var(--spacing-16);
      background: var(--color-white);
      border: 1px solid var(--color-black-10);
      border-radius: var(--radius-16);
      box-shadow: var(--shadow-card);
      padding: var(--spacing-20, 20px) var(--spacing-24);
      flex-wrap: wrap;
    }

    .store-card__icon {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: var(--radius-10);
      background: var(--color-black);
      color: var(--color-white);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .store-card__icon svg {
      width: 22px;
      height: 22px;
    }

    .store-card__body {
      flex: 1 1 220px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .store-card__name-row {
      display: flex;
      align-items: center;
      gap: var(--spacing-8);
      flex-wrap: wrap;
    }

    .store-card__name {
      font-size: var(--fs-18);
      font-weight: var(--fw-bold);
    }

    .store-card__meta {
      font-size: var(--fs-13);
      color: var(--color-black-55);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      font-size: var(--fs-13);
      font-weight: var(--fw-semibold);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      white-space: nowrap;
    }

    .badge--published {
      background: var(--color-green-bg);
      color: var(--color-green);
    }

    .badge--draft {
      background: var(--color-grey-bg);
      color: var(--color-grey);
    }

    .store-card__actions {
      display: flex;
      align-items: center;
      gap: var(--spacing-8);
      flex-shrink: 0;
    }

    .action-btn {
      background: transparent;
      border: 1px solid var(--color-black-10);
      border-radius: var(--radius-10);
      padding: var(--spacing-8) var(--spacing-16);
      font-size: var(--fs-14);
      font-weight: var(--fw-medium);
      color: var(--color-black);
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .action-btn:hover {
      background: var(--color-black-5);
    }

    .action-btn--danger {
      color: var(--color-red);
    }

    .action-btn--danger:hover {
      background: var(--color-red-bg);
      border-color: var(--color-red-bg);
    }

    /* ─── Empty state ───────────────────────────────────────────── */
    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-16);
      text-align: center;
      padding: var(--spacing-64) var(--spacing-24);
      border: 1px dashed var(--color-black-10);
      border-radius: var(--radius-16);
    }

    .empty-state.is-visible {
      display: flex;
    }

    .empty-state__title {
      font-size: var(--fs-18);
      font-weight: var(--fw-bold);
    }

    .empty-state__desc {
      font-size: var(--fs-14);
      color: var(--color-black-55);
      max-width: 360px;
    }

    /* ─── Responsive ────────────────────────────────────────────── */
    @media (max-width: 720px) {
      .topbar {
        padding: 0 var(--spacing-16);
        height: 72px;
      }

      .page {
        padding: var(--spacing-32) var(--spacing-16);
      }

      .page__title {
        font-size: 26px;
      }

      .store-card {
        padding: var(--spacing-16);
      }

      .store-card__actions {
        width: 100%;
        justify-content: flex-start;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <img class="topbar__bg" src="images/decorations/Background.svg" alt="" aria-hidden="true">
    <span class="topbar__brand">Goez Shop</span>
  </header>

  <main class="page">
    <a href="goez-home.html" id="backHomeLink" class="breadcrumb" data-i18n="backHome">‹ 返回會員首頁</a>

    <div class="page__header">
      <div class="page__title-group">
        <h1 class="page__title" data-i18n="pageTitle">管理已建立賣場</h1>
        <p class="page__subtitle" data-i18n="pageSubtitle">查看、編輯或刪除你所有的賣場。</p>
      </div>
    </div>

    <div class="store-list" id="storeList"></div>

    <!-- 修改後的空狀態提示文字 -->
    <div class="empty-state" id="emptyState">
      <p class="empty-state__title" data-i18n="emptyTitle">尚未建立賣場唷！</p>
      <p class="empty-state__desc" data-i18n="emptyDesc">請至首頁點選「設計我的賣場」開始你的第一間線上小店吧！</p>
    </div>
  </main>

  <!-- 1. 引入 i18n 核心與賣場管理字典檔 -->
  <script src="./i18n/i18n-core.js"></script>
  <script src="./i18n/storeManage.js"></script>

  <script>
    // ── 多語言取詞輔助函式 ──
    function t(key, fallback) {
      if (window.GoezI18n && typeof GoezI18n.t === 'function') {
        return GoezI18n.t(key, fallback);
      }
      return fallback || '';
    }

    // ─── 全域變數準備 ───
    let stores = []; // 用來存放從後端抓回來的賣場清單

    // 1. 從網址列取得 sellerId (如果網址沒有，預設先帶 15，對應你的資料庫測試)
    const urlParams = new URLSearchParams(window.location.search);
    const sellerId = urlParams.get('sellerId') || '15';

    // 2. 處理「返回會員首頁」的超連結，讓它也能帶上 sellerId
    const backHomeLink = document.getElementById('backHomeLink');
    if (backHomeLink) {
      backHomeLink.href = `goez-home.html?sellerId=${sellerId}`;
    }

    const storeIconSVG = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.5V19a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9.5" />
        <path d="M3 9.5 4.6 4h14.8L21 9.5" />
        <path d="M3 9.5a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0" />
        <path d="M10 20v-5a2 2 0 0 1 2-2 2 2 0 0 1 2 2v5" />
      </svg>`;

    // ─── 畫面渲染邏輯 ───
    function renderStores() {
      const listEl = document.getElementById('storeList');
      const emptyEl = document.getElementById('emptyState');

      if (stores.length === 0) {
        listEl.innerHTML = '';
        emptyEl.classList.add('is-visible');
        return;
      }
      emptyEl.classList.remove('is-visible');

      listEl.innerHTML = stores.map(store => {
        // ─── 1. 動態判斷「檢視」按鈕的網址 ───
        let viewUrl = '';
        if (store.status === 'published') {
          if (store.customUrl && store.customUrl.trim() !== '') {
            viewUrl = `/store/${encodeURIComponent(store.customUrl)}`;
          } else {
            viewUrl = `goez-shop-store-template.html?pageId=${encodeURIComponent(store.id)}`;
          }
        }

        // ─── 2. 「編輯」按鈕的網址 (帶入 pageId 與 sellerId) ───
        const editUrl = `goez-store.html?pageId=${encodeURIComponent(store.id)}`;

        const statusText = store.status === 'published'
          ? t('statusPublished', '已發布')
          : t('statusDraft', '草稿');

        const createdAtText = t('createdAtPrefix', '建立於 {date}').replace('{date}', store.createdAt);

        return `
          <article class="store-card">
            <div class="store-card__icon">${storeIconSVG}</div>
            <div class="store-card__body">
              <div class="store-card__name-row">
                <span class="store-card__name">${escapeHtml(store.name)}</span>
                <span class="badge ${store.status === 'published' ? 'badge--published' : 'badge--draft'}">
                  ${statusText}
                </span>
              </div>
              <span class="store-card__meta">${createdAtText}</span>
            </div>
            <div class="store-card__actions">
              <!-- 條件渲染：只有狀態為 published 時才顯示「檢視」 -->
              ${store.status === 'published' ? `
                <a class="action-btn" href="${viewUrl}" target="_blank">${t('btnView', '檢視')}</a>
              ` : ''}
              
              <!-- 編輯按鈕 -->
              <a class="action-btn" href="${editUrl}">${t('btnEdit', '編輯')}</a>
              
              <!-- 刪除按鈕 -->
              <button class="action-btn action-btn--danger" onclick="handleDeleteStore('${store.id}')">${t('btnDelete', '刪除')}</button>
            </div>
          </article>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    // ─── 刪除邏輯 ───
    async function handleDeleteStore(id) {
      const store = stores.find(s => String(s.id) === String(id));
      if (!store) return;

      const confirmMsg = t('confirmDeleteStore', '確定要刪除「{name}」嗎？此操作無法復原。').replace('{name}', store.name);
      const confirmed = confirm(confirmMsg);
      if (!confirmed) return;

      try {
        const response = await fetch(`/api/store/pages/${id}`, {
          method: 'DELETE'
        });
        const result = await response.json();

        if (result.success) {
          stores = stores.filter(s => String(s.id) !== String(id));
          renderStores();
          alert(t('deleteSuccess', '賣場刪除成功！'));
        } else {
          alert(t('deleteFail', '刪除失敗: ') + (result.message || t('unknownError', '未知錯誤')));
        }
      } catch (err) {
        console.error('連線伺服器刪除失敗:', err);
        alert(t('networkError', '網路異常，刪除失敗，請稍後再試'));
      }
    }

    // ─── 網頁載入時：初始化語系並呼叫後端 API 取得資料 ───
    document.addEventListener('DOMContentLoaded', () => {
      // 1. 初始化套用多語言記憶
      if (window.GoezI18n) {
        GoezI18n.apply();
        document.title = GoezI18n.t('pageTitleStoreManage');
      }

      // 2. 抓取賣場資料
      fetch(`/api/store/my-stores?sellerId=${sellerId}`)
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            stores = data.stores;
            renderStores();
          } else {
            console.error('載入賣場失敗:', data.message);
            renderStores();
          }
        })
        .catch(err => {
          console.error('連線伺服器發生錯誤:', err);
          renderStores();
        });
    });
  </script>
</body>

</html>
