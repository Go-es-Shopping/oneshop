<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">我的店鋪</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    /* ═══════════════════════════════════
       DESIGN TOKENS  ── 主題色由 JS 動態注入
    ═══════════════════════════════════ */
    :root {
      --c-accent:       #6588A6;   /* 由 STORE_CONFIG.accentColor 覆蓋 */
      --c-accent-dark:  #4e6d8c;
      --c-white:        #ffffff;
      --c-bg-page:      #f3f4f6;
      --c-bg-light:     #f9fafb;
      --c-bg-subtle:    #f8fafc;
      --c-border:       #e5e7eb;
      --c-border-light: #f3f4f6;
      --c-text-heading: #101828;
      --c-text-muted:   #6a7282;
      --c-text-faint:   #99a1af;
      --c-text-nav:     #4a5565;
      --r-10: 10px; --r-14: 14px; --r-16: 16px;
      --r-24: 24px; --r-full: 9999px;
      --shadow-sm:   0 1px 2px rgba(0,0,0,.08);
      --shadow-card: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
      --shadow-btn:  0 4px 12px rgba(0,0,0,.15);
      --shadow-lg:   0 8px 24px rgba(0,0,0,.12);
    }

    /* ═══════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background: var(--c-bg-page);
      color: var(--c-text-heading);
      min-width: 320px;
      overflow-x: hidden;
    }
    img { display: block; max-width: 100%; }
    button { cursor: pointer; border: none; background: none; font: inherit; padding: 0; }
    a { text-decoration: none; color: inherit; }
    ul, ol { list-style: none; }

    .page {
      display: flex; flex-direction: column;
      min-height: 100vh; background: var(--c-white);
    }

    /* ═══════════════════════════════════
       STORE NAV
    ═══════════════════════════════════ */
    .store-nav {
      background: var(--c-white);
      border-bottom: 1px solid var(--c-border-light);
      height: 70px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px; flex-shrink: 0;
      position: sticky; top: 0; z-index: 100;
      transition: box-shadow 0.3s ease;
    }
    .store-nav.scrolled { box-shadow: 0 2px 12px rgba(0,0,0,.08); }

    .store-nav__brand { display: flex; align-items: center; gap: 12px; }
    .store-nav__logo {
      width: 40px; height: 40px;
      border-radius: var(--r-10); box-shadow: var(--shadow-card);
      overflow: hidden; flex-shrink: 0;
      background: var(--c-bg-page);
    }
    .store-nav__logo img { width: 100%; height: 100%; object-fit: cover; }
    .store-nav__logo-initial {
      width: 100%; height: 100%;
      background: linear-gradient(135deg, var(--c-accent) 0%, var(--c-accent-dark) 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 900; color: white;
    }
    .store-nav__name {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 700; font-size: 18px;
      color: var(--c-text-heading); letter-spacing: -0.5px;
    }
    .store-nav__name--placeholder { color: var(--c-text-faint); }

    .store-nav__right { display: flex; align-items: center; gap: 24px; }
    .store-nav__links { display: flex; align-items: center; gap: 4px; }
    .store-nav__link {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 500; font-size: 14px;
      color: var(--c-text-nav); padding: 6px 12px;
      border-radius: var(--r-10);
      transition: background 0.2s ease, color 0.2s ease;
    }
    .store-nav__link:hover { background: var(--c-bg-page); color: var(--c-text-heading); }
    .store-nav__link.active { color: var(--c-accent); font-weight: 700; }

    .store-nav__actions { display: flex; align-items: center; gap: 4px; }
    .store-nav__action-btn {
      width: 36px; height: 36px; border-radius: var(--r-full);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s ease;
    }
    .store-nav__action-btn:hover { background: var(--c-bg-page); }

    .store-nav__cart-wrap { position: relative; }
    .store-nav__cart-badge {
      position: absolute; top: 2px; right: 2px;
      background: var(--c-accent); border-radius: var(--r-full);
      width: 16px; height: 16px;
      display: none; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; color: var(--c-white);
    }
    .store-nav__cart-badge.show { display: flex; }

    .store-nav__hamburger {
      display: none; flex-direction: column; gap: 5px;
      width: 36px; height: 36px; padding: 8px; border-radius: var(--r-10);
    }
    .store-nav__hamburger span {
      display: block; height: 2px;
      background: var(--c-text-heading); border-radius: 2px;
      transition: all 0.3s ease;
    }

    /* ═══════════════════════════════════
       MOBILE MENU
    ═══════════════════════════════════ */
    .mobile-menu {
      display: none; position: fixed; inset: 0; top: 70px;
      background: rgba(0,0,0,.5); z-index: 99;
    }
    .mobile-menu.open { display: block; }
    .mobile-menu__panel {
      background: var(--c-white); padding: 12px;
      display: flex; flex-direction: column; gap: 4px;
      box-shadow: var(--shadow-lg);
    }
    .mobile-menu__link {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 500; font-size: 16px;
      color: var(--c-text-heading);
      padding: 12px 16px; border-radius: var(--r-14); display: block;
    }
    .mobile-menu__link:hover { background: var(--c-bg-page); }

    /* ═══════════════════════════════════
       HERO
    ═══════════════════════════════════ */
    .store-hero {
      background: var(--c-white); padding: 64px 32px 48px;
      display: flex; flex-direction: column;
      align-items: center; gap: 24px;
      text-align: center; position: relative; overflow: hidden;
    }
    .store-hero::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(var(--accent-rgb, 101,136,166),.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .store-hero__eyebrow {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 700; font-size: 11px;
      color: var(--c-accent); letter-spacing: 2px; text-transform: uppercase;
      background: rgba(var(--accent-rgb, 101,136,166),.1);
      padding: 4px 12px; border-radius: var(--r-full);
    }
    .store-hero__eyebrow:empty { display: none; }
    .store-hero__tagline {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 400; font-size: 17px;
      color: var(--c-text-muted); line-height: 1.7; max-width: 480px;
    }
    .store-hero__tagline--placeholder { color: var(--c-text-faint); font-style: italic; }
    .store-hero__cta-wrap { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .store-hero__cta-btn {
      background: var(--c-accent); border-radius: var(--r-full);
      box-shadow: var(--shadow-btn); height: 48px; padding: 0 32px;
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 700; font-size: 15px; color: var(--c-white);
      display: inline-flex; align-items: center; justify-content: center;
      transition: filter 0.2s ease, transform 0.2s ease;
    }
    .store-hero__cta-btn:hover { filter: brightness(0.9); transform: translateY(-2px); }
    .store-hero__cta-secondary {
      height: 48px; padding: 0 24px;
      border: 1.5px solid var(--c-border); border-radius: var(--r-full);
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 500; font-size: 15px; color: var(--c-text-muted);
      display: inline-flex; align-items: center; justify-content: center;
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .store-hero__cta-secondary:hover { border-color: var(--c-accent); color: var(--c-accent); }

    /* ═══════════════════════════════════
       CATEGORY CHIPS
    ═══════════════════════════════════ */
    .store-categories {
      padding: 0 32px 24px;
      display: flex; align-items: center; gap: 8px;
      overflow-x: auto; scrollbar-width: none;
    }
    .store-categories::-webkit-scrollbar { display: none; }
    .store-categories:empty { display: none; }
    .category-chip {
      height: 34px; padding: 0 16px; border-radius: var(--r-full);
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 500; font-size: 13px;
      white-space: nowrap; flex-shrink: 0;
      border: 1.5px solid var(--c-border);
      color: var(--c-text-muted); background: var(--c-white);
      transition: all 0.2s ease;
    }
    .category-chip:hover { border-color: var(--c-accent); color: var(--c-accent); }
    .category-chip.active { background: var(--c-accent); border-color: var(--c-accent); color: var(--c-white); }

    /* ═══════════════════════════════════
       PRODUCTS SECTION
    ═══════════════════════════════════ */
    .store-products { padding: 0 24px 40px; display: flex; flex-direction: column; gap: 24px; }
    .store-products__header { display: flex; align-items: center; justify-content: space-between; }
    .store-products__heading { display: flex; align-items: center; gap: 8px; }
    .store-products__heading-text {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 700; font-size: 22px;
      color: var(--c-text-heading); line-height: 32px;
    }
    .store-products__more {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 500; font-size: 14px; color: var(--c-accent);
      display: flex; align-items: center; gap: 4px;
      padding: 6px 12px; border-radius: var(--r-10);
      transition: background 0.2s ease;
    }
    .store-products__more:hover { background: rgba(var(--accent-rgb,101,136,166),.08); }
    .store-products__more::after { content: '→'; font-size: 14px; }

    .store-products__grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    /* ═══════════════════════════════════
       PRODUCT CARD
    ═══════════════════════════════════ */
    .product-card {
      background: var(--c-white);
      border: 1px solid var(--c-border-light);
      border-radius: var(--r-24);
      box-shadow: var(--shadow-card);
      overflow: hidden; display: flex; flex-direction: column;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(.22,1,.36,1), box-shadow 0.25s ease;
    }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,.1); }

    .product-card__image-area {
      height: 180px; flex-shrink: 0;
      overflow: hidden; position: relative; background: var(--c-bg-page);
      display: flex; align-items: center; justify-content: center;
    }
    .product-card__image-area img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.4s cubic-bezier(.22,1,.36,1);
    }
    .product-card:hover .product-card__image-area img { transform: scale(1.06); }

    /* 無圖片時的佔位符 */
    .product-card__image-placeholder {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      width: 100%; height: 100%;
      color: var(--c-text-faint);
    }
    .product-card__image-placeholder svg { opacity: 0.3; }
    .product-card__image-placeholder span {
      font-size: 11px; font-weight: 500; opacity: 0.5;
    }

    .product-card__badge {
      position: absolute; top: 12px; left: 12px;
      background: var(--c-accent); color: var(--c-white);
      font-size: 10px; font-weight: 700;
      padding: 3px 8px; border-radius: var(--r-full);
    }

    .product-card__body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 8px; }
    .product-card__meta { display: flex; align-items: center; justify-content: space-between; }
    .product-card__tag {
      background: var(--c-bg-light); border-radius: var(--r-full);
      padding: 0 10px; height: 26px; display: flex; align-items: center;
    }
    .product-card__tag-text {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 700; font-size: 10px;
      color: var(--c-text-faint); letter-spacing: 0.5px;
    }
    .product-card__stock {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 400; font-size: 11px; color: var(--c-text-faint);
    }
    .product-card__stock.low { color: #e07046; }

    .product-card__name {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 700; font-size: 16px;
      color: var(--c-text-heading); line-height: 1.4;
    }
    .product-card__name--placeholder { color: var(--c-text-faint); font-style: italic; }

    .product-card__footer { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
    .product-card__price {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 900; font-size: 18px; color: var(--c-accent);
    }
    .product-card__price--placeholder { color: var(--c-text-faint); font-weight: 500; font-size: 14px; }
    .product-card__price-orig {
      font-size: 12px; font-weight: 500; color: var(--c-text-faint);
      text-decoration: line-through; margin-left: 4px;
    }
    .product-card__cart-btn {
      background: var(--c-accent); border-radius: var(--r-14);
      box-shadow: var(--shadow-btn); width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: filter 0.2s ease, transform 0.15s ease;
    }
    .product-card__cart-btn:hover { filter: brightness(0.88); transform: scale(1.08); }
    .product-card__cart-btn:active { transform: scale(0.96); }

    /* 空商品網格提示 */
    .products-empty {
      grid-column: 1 / -1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; padding: 60px 20px;
      color: var(--c-text-faint);
      border: 2px dashed var(--c-border);
      border-radius: var(--r-24);
    }
    .products-empty__icon { font-size: 40px; opacity: 0.4; }
    .products-empty__text {
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 15px; font-weight: 500; text-align: center;
      line-height: 1.6;
    }

    /* ═══════════════════════════════════
       PROMO BANNER（可選）
    ═══════════════════════════════════ */
    .promo-banner {
      margin: 0 24px 40px;
      background: linear-gradient(135deg, var(--c-accent) 0%, var(--c-accent-dark) 100%);
      border-radius: var(--r-24); padding: 32px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      overflow: hidden; position: relative;
    }
    .promo-banner::before {
      content: ''; position: absolute; top: -40px; right: -40px;
      width: 160px; height: 160px;
      background: rgba(255,255,255,.08); border-radius: 50%;
    }
    .promo-banner__text { position: relative; z-index: 1; }
    .promo-banner__title {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 900; font-size: 20px; color: var(--c-white);
      line-height: 1.3; margin-bottom: 6px;
    }
    .promo-banner__sub {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 400; font-size: 13px;
      color: rgba(255,255,255,.75); line-height: 1.6;
    }
    .promo-banner__btn {
      position: relative; z-index: 1;
      background: var(--c-white); color: var(--c-accent);
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 700; font-size: 14px;
      padding: 10px 20px; border-radius: var(--r-full);
      white-space: nowrap; flex-shrink: 0;
      transition: transform 0.2s ease;
    }
    .promo-banner__btn:hover { transform: translateY(-1px); }
    .promo-banner.hidden { display: none; }

    /* ═══════════════════════════════════
       STORE FOOTER
    ═══════════════════════════════════ */
    .store-footer {
      background: var(--c-accent);
      border-radius: 48px 48px 0 0;
      padding: 56px 40px 36px;
      display: flex; flex-direction: column; gap: 32px;
      margin-top: auto; flex-shrink: 0;
    }
    .store-footer__cols { display: flex; gap: 32px; flex-wrap: wrap; }

    .store-footer__about { flex: 1.5; min-width: 140px; display: flex; flex-direction: column; gap: 12px; }
    .store-footer__brand {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 700; font-size: 18px; color: var(--c-white);
    }
    .store-footer__brand--placeholder { opacity: 0.4; }
    .store-footer__desc {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 400; font-size: 13px;
      color: rgba(255,255,255,.7); line-height: 1.7; max-width: 180px;
    }

    .store-footer__links { min-width: 80px; display: flex; flex-direction: column; }
    .store-footer__links:empty { display: none; }
    .store-footer__contact { min-width: 120px; display: flex; flex-direction: column; }

    .store-footer__col-title {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 700; font-size: 14px; color: var(--c-white);
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,.15);
      margin-bottom: 16px;
    }
    .store-footer__col-list { display: flex; flex-direction: column; gap: 10px; }
    .store-footer__col-item { display: flex; align-items: center; gap: 8px; }
    .store-footer__col-dot {
      width: 4px; height: 4px;
      background: rgba(255,255,255,.3); border-radius: var(--r-full); flex-shrink: 0;
    }
    .store-footer__col-link {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 500; font-size: 14px;
      color: rgba(255,255,255,.7); transition: color 0.2s ease;
    }
    .store-footer__col-link:hover { color: var(--c-white); }

    .store-footer__contact-items { display: flex; flex-direction: column; gap: 12px; }
    .store-footer__contact-row { display: flex; align-items: center; gap: 10px; }
    .store-footer__contact-icon { width: 36px; height: 36px; flex-shrink: 0; }

    .store-footer__contact-email,
    .store-footer__contact-phone {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 500; font-size: 13px; color: rgba(255,255,255,.75);
    }
    .store-footer__contact-email--placeholder,
    .store-footer__contact-phone--placeholder { opacity: 0.35; font-style: italic; }

    .store-footer__bottom { border-top: 1px solid rgba(255,255,255,.1); padding-top: 24px; text-align: center; }
    .store-footer__copyright {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 400; font-size: 11px; color: rgba(255,255,255,.4);
    }

    /* ═══════════════════════════════════
       CART DRAWER
    ═══════════════════════════════════ */
    .cart-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 200;
      backdrop-filter: blur(2px);
    }
    .cart-overlay.open { display: block; }
    .cart-drawer {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: 360px; max-width: 100vw;
      background: var(--c-white); box-shadow: -8px 0 40px rgba(0,0,0,.15);
      z-index: 201; display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(.22,1,.36,1);
    }
    .cart-drawer.open { transform: translateX(0); }
    .cart-drawer__header {
      padding: 20px 24px; border-bottom: 1px solid var(--c-border-light);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .cart-drawer__title {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 700; font-size: 18px; color: var(--c-text-heading);
      display: flex; align-items: center; gap: 8px;
    }
    .cart-drawer__count {
      background: var(--c-accent); color: var(--c-white);
      font-size: 11px; font-weight: 700;
      padding: 2px 7px; border-radius: var(--r-full);
    }
    .cart-drawer__close {
      width: 32px; height: 32px; border-radius: var(--r-full);
      display: flex; align-items: center; justify-content: center;
      color: var(--c-text-muted); font-size: 18px;
      transition: background 0.2s ease;
    }
    .cart-drawer__close:hover { background: var(--c-bg-page); }
    .cart-drawer__body { flex: 1; overflow-y: auto; padding: 16px; }
    .cart-empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; gap: 12px; color: var(--c-text-faint);
    }
    .cart-empty__icon { font-size: 48px; opacity: 0.4; }
    .cart-empty__text { font-family: 'Noto Sans TC', sans-serif; font-size: 15px; font-weight: 500; }
    .cart-item {
      display: flex; gap: 12px; padding: 12px;
      border-radius: var(--r-16); margin-bottom: 8px;
      background: var(--c-bg-subtle); border: 1px solid var(--c-border-light);
    }
    .cart-item__img {
      width: 60px; height: 60px; border-radius: var(--r-10);
      overflow: hidden; flex-shrink: 0;
      background: var(--c-bg-page);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .cart-item__img img { width: 100%; height: 100%; object-fit: cover; }
    .cart-item__info { flex: 1; min-width: 0; }
    .cart-item__name {
      font-family: 'Noto Sans TC', sans-serif; font-weight: 600; font-size: 13px;
      color: var(--c-text-heading); line-height: 1.4; margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cart-item__price { font-weight: 700; font-size: 14px; color: var(--c-accent); }

    /* ═══════════════════════════════════

    /* ═══════════════════════════════════

    .toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 500; pointer-events: none; }

    /* ═══════════════════════════════════

    ═══════════════════════════════════ */

      font-family: 'Noto Sans TC', sans-serif; font-weight: 600; font-size: 13px;
      color: var(--c-text-heading);
    }
    .auth-field input {
      height: 44px; border: 1.5px solid var(--c-border);
      border-radius: var(--r-14); padding: 0 14px;
      font-family: 'Noto Sans TC', sans-serif; font-size: 15px;

    .auth-social {

    /* ─ 平板 (769–1024px) ─ */

    }
  </style>

<script>
/* ══════════════════════════════════
   主題色注入
══════════════════════════════════ */
(function applyTheme() {
  const hex = STORE_CONFIG.accentColor || '#6588A6';
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const dark = `#${[r,g,b].map(v=>Math.max(0,Math.round(v*0.8)).toString(16).padStart(2,'0')).join('')}`;
  const root = document.documentElement;
  root.style.setProperty('--c-accent', hex);
  root.style.setProperty('--c-accent-dark', dark);
  root.style.setProperty('--accent-rgb', `${r},${g},${b}`);
  root.style.setProperty('--shadow-btn', `0 4px 12px rgba(${r},${g},${b},.35)`);
})();

/* ══════════════════════════════════
   購物車狀態
══════════════════════════════════ */
let cart = JSON.parse(localStorage.getItem('goez_cart_v2') || '[]');

const saveCart = () => localStorage.setItem('goez_cart_v2', JSON.stringify(cart));
const totalItems = () => cart.reduce((s,i) => s+i.qty, 0);
const totalPrice = () => cart.reduce((s,i) => s+i.price*i.qty, 0);

function addToCart(productId, qty = 1) {
  const p = STORE_CONFIG.products.find(x => x.id === productId);
  if (!p) return;
  const existing = cart.find(i => i.id === productId);
  if (existing) existing.qty = Math.min(existing.qty + qty, p.stock || 99);
  else cart.push({ id: productId, name: p.name, price: p.price, imageUrl: p.imageUrl || '', qty });
  saveCart(); updateCartUI();
  showToast(`✓ ${p.name} 已加入購物車`, 'success');
}

function removeFromCart(id) { cart = cart.filter(i => i.id !== id); saveCart(); updateCartUI(); renderCartItems(); }

function updateQty(id, d) {
  const item = cart.find(i => i.id === id);
  const p = STORE_CONFIG.products.find(x => x.id === id);
  if (item) { item.qty = Math.max(1, Math.min(item.qty + d, p?.stock || 99)); saveCart(); updateCartUI(); renderCartItems(); }
}

function updateCartUI() {
  const n = totalItems();
  document.getElementById('navCartCount').textContent = n;
  document.getElementById('cartCountBadge').textContent = n;
  document.getElementById('navCartBadge').classList.toggle('show', n > 0);
}

function renderCartItems() {
  const el = document.getElementById('cartItems');
  const empty = document.getElementById('cartEmpty');
  const footer = document.getElementById('cartFooter');
  if (!cart.length) { empty.style.display='flex'; el.innerHTML=''; footer.style.display='none'; return; }
  empty.style.display = 'none';
  footer.style.display = 'block';
  el.innerHTML = cart.map(item => {
    const thumb = item.imageUrl
      ? `<img src="${item.imageUrl}" alt="${item.name}">`
      : `<span>🛍️</span>`;
    return `<div class="cart-item">
      <div class="cart-item__img">${thumb}</div>
      <div class="cart-item__info">
        <div class="cart-item__name">${item.name}</div>
        <div class="cart-item__price">$${(item.price*item.qty).toLocaleString()}</div>
      </div>
      <div class="cart-item__controls">
        <button class="cart-item__remove" onclick="removeFromCart(${item.id})">✕</button>
        <div class="cart-item__qty">
          <button class="cart-item__qty-btn" onclick="updateQty(${item.id},-1)">−</button>
          <span class="cart-item__qty-num">${item.qty}</span>
          <button class="cart-item__qty-btn" onclick="updateQty(${item.id},1)">+</button>
        </div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('cartTotal').textContent = `$${totalPrice().toLocaleString()}`;
}

/* ══════════════════════════════════
   抽屜 / Modal / 搜尋
══════════════════════════════════ */
function openCart()  { renderCartItems(); document.getElementById('cartOverlay').classList.add('open'); document.getElementById('cartDrawer').classList.add('open'); document.body.style.overflow='hidden'; }
function closeCart() { document.getElementById('cartOverlay').classList.remove('open'); document.getElementById('cartDrawer').classList.remove('open'); document.body.style.overflow=''; }
function checkout()  { showToast('即將跳轉至結帳頁面…'); setTimeout(closeCart, 1500); }

function openSearch() { document.getElementById('searchOverlay').classList.add('open'); document.body.style.overflow='hidden'; setTimeout(()=>document.getElementById('searchInput').focus(),100); }
function closeSearch() { document.getElementById('searchOverlay').classList.remove('open'); document.body.style.overflow=''; document.getElementById('searchInput').value=''; document.getElementById('searchResults').innerHTML='<div class="search-hint">輸入關鍵字搜尋商品</div>'; }
function handleSearchBg(e) { if (e.target===document.getElementById('searchOverlay')) closeSearch(); }

function doSearch(q) {
  const box = document.getElementById('searchResults');
  if (!q.trim()) { box.innerHTML='<div class="search-hint">輸入關鍵字搜尋商品</div>'; return; }
  const hits = STORE_CONFIG.products.filter(p => p.name?.toLowerCase().includes(q.toLowerCase()) || p.category?.toLowerCase().includes(q.toLowerCase()));
  if (!hits.length) { box.innerHTML=`<div class="search-hint">找不到「${q}」的相關商品</div>`; return; }
  box.innerHTML = hits.map(p => {
    const thumb = p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.name}">` : `<span>🛍️</span>`;
    return `<div class="search-result-item" onclick="openProductModal(${p.id});closeSearch()">
      <div class="search-result-item__img">${thumb}</div>
      <span class="search-result-item__name">${p.name}</span>
      <span class="search-result-item__price">$${p.price?.toLocaleString()}</span>
    </div>`;
  }).join('');
}

let modalProductId = null, modalQtyVal = 1;

function openProductModal(id) {
  const p = STORE_CONFIG.products.find(x => x.id === id);
  if (!p) return;
  modalProductId = id; modalQtyVal = 1;
  document.getElementById('modalTag').textContent   = p.category || '';
  document.getElementById('modalName').textContent  = p.name || '';
  document.getElementById('modalDesc').textContent  = p.description || '';
  document.getElementById('modalPrice').textContent = p.price ? `$${p.price.toLocaleString()}` : '';
  document.getElementById('modalStock').textContent = p.stock != null ? `剩餘 ${p.stock} 件` : '';
  document.getElementById('modalQty').textContent   = '1';
  const imgArea = document.getElementById('modalImg');
  imgArea.style.background = '';
  const ph = document.getElementById('modalImgPlaceholder');
  if (p.imageUrl) {
    ph.style.display = 'none';
    let img = imgArea.querySelector('img');
    if (!img) { img = document.createElement('img'); imgArea.insertBefore(img, imgArea.firstChild); }
    img.src = p.imageUrl; img.alt = p.name;
  } else {
    ph.style.display = 'block'; ph.textContent = '🛍️';
    const img = imgArea.querySelector('img'); if (img) img.remove();
  }
  document.getElementById('productModalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() { document.getElementById('productModalOverlay').classList.remove('open'); document.body.style.overflow=''; }
function handleModalBg(e) { if (e.target===document.getElementById('productModalOverlay')) closeModal(); }
function changeModalQty(d) { const p = STORE_CONFIG.products.find(x=>x.id===modalProductId); modalQtyVal = Math.max(1,Math.min(modalQtyVal+d,p?.stock||99)); document.getElementById('modalQty').textContent=modalQtyVal; }
function addModalToCart() { addToCart(modalProductId, modalQtyVal); closeModal(); }

/* ══════════════════════════════════
   商品渲染
══════════════════════════════════ */
let currentCategory = 'all';

const CART_ICON_SVG = `<svg width="18" height="18" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5.33333 14.6667C5.70152 14.6667 6 14.3682 6 14C6 13.6318 5.70152 13.3333 5.33333 13.3333C4.96514 13.3333 4.66666 13.6318 4.66666 14C4.66666 14.3682 4.96514 14.6667 5.33333 14.6667Z" stroke="white" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.6667 14.6667C13.0349 14.6667 13.3333 14.3682 13.3333 14C13.3333 13.6318 13.0349 13.3333 12.6667 13.3333C12.2985 13.3333 12 13.6318 12 14C12 14.3682 12.2985 14.6667 12.6667 14.6667Z" stroke="white" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/><path d="M1.36667 1.36667H2.7L4.47334 9.64667C4.53839 9.94991 4.70712 10.221 4.95048 10.4132C5.19384 10.6055 5.49661 10.7069 5.80667 10.7H12.3267C12.6301 10.6995 12.9243 10.5955 13.1607 10.4052C13.397 10.2149 13.5614 9.94969 13.6267 9.65333L14.7267 4.7H3.41334" stroke="white" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const IMAGE_PLACEHOLDER_SVG = `<div class="product-card__image-placeholder"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>尚未上傳圖片</span></div>`;

function renderProducts(category = 'all') {
  const grid = document.getElementById('productsGrid');
  const list = STORE_CONFIG.products;

  if (!list.length) {
    grid.innerHTML = `<div class="products-empty"><div class="products-empty__icon">🛍️</div><div class="products-empty__text">尚未新增任何商品<br>請在 STORE_CONFIG.products 中加入商品</div></div>`;
    return;
  }

  const filtered = category === 'all' ? list : list.filter(p => p.category === category);

  if (!filtered.length) {
    grid.innerHTML = `<div class="products-empty"><div class="products-empty__icon">🔍</div><div class="products-empty__text">此分類暫無商品</div></div>`;
    return;
  }

  grid.innerHTML = filtered.map((p, i) => {
    const imgHtml = p.imageUrl
      ? `<img src="${p.imageUrl}" alt="${p.name}" loading="lazy">`
      : IMAGE_PLACEHOLDER_SVG;
    const badge    = p.badge ? `<span class="product-card__badge">${p.badge}</span>` : '';
    const nameHtml = p.name  ? p.name : '<span class="product-card__name--placeholder">（未填寫商品名稱）</span>';
    const priceHtml = p.price != null
      ? `$${p.price.toLocaleString()}${p.originalPrice ? `<span class="product-card__price-orig">$${p.originalPrice.toLocaleString()}</span>` : ''}`
      : '<span class="product-card__price--placeholder">待定價</span>';
    const stockClass = (p.stock != null && p.stock <= 5) ? 'low' : '';
    const stockText  = p.stock != null ? `剩餘 ${p.stock}` : '';

    return `<article class="product-card fade-up delay-${(i%4)+1}" onclick="openProductModal(${p.id})">
      <div class="product-card__image-area">${imgHtml}${badge}</div>
      <div class="product-card__body">
        <div class="product-card__meta">
          <div class="product-card__tag"><span class="product-card__tag-text">${p.category || '未分類'}</span></div>
          <span class="product-card__stock ${stockClass}">${stockText}</span>
        </div>
        <div class="product-card__name">${nameHtml}</div>
        <div class="product-card__footer">
          <div class="product-card__price">${priceHtml}</div>
          <button class="product-card__cart-btn" onclick="event.stopPropagation();addToCart(${p.id})">${CART_ICON_SVG}</button>
        </div>
      </div>
    </article>`;
  }).join('');

  grid.querySelectorAll('.fade-up').forEach(el => { el.classList.remove('visible'); observer.observe(el); });
}

function filterCategory(cat, btn) {
  currentCategory = cat;
  document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  renderProducts(cat);
}

/* ══════════════════════════════════
   Toast
══════════════════════════════════ */
function showToast(msg, type='') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`; t.textContent = msg; c.appendChild(t);
  setTimeout(()=>{ t.style.animation='toastOut .3s ease forwards'; setTimeout(()=>t.remove(),300); }, 2400);
}

function toggleMobileMenu()  { document.getElementById('mobileMenu').classList.toggle('open'); }
function closeMobileMenu()   { document.getElementById('mobileMenu').classList.remove('open'); }

/* ══════════════════════════════════
   滾動陰影
══════════════════════════════════ */
window.addEventListener('scroll', () => {
  document.getElementById('storeNav').classList.toggle('scrolled', window.scrollY > 10);
}, { passive: true });

/* ══════════════════════════════════
   Intersection Observer
══════════════════════════════════ */
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }});
}, { threshold: 0.12 });

/* ══════════════════════════════════
   渲染頁面（從 STORE_CONFIG 讀取）
══════════════════════════════════ */
(function render() {
  const C = STORE_CONFIG;

  /* 頁籤標題 */
  document.getElementById('page-title').textContent = C.name || '我的店鋪';

  /* Logo & 店名 */
  const logoEl = document.getElementById('navLogo');
  if (C.logoUrl) {
    logoEl.innerHTML = `<img src="${C.logoUrl}" alt="${C.name}">`;
  } else {
    const initial = C.name ? C.name.charAt(0) : '店';
    logoEl.innerHTML = `<div class="store-nav__logo-initial">${initial}</div>`;
  }
  const nameEl = document.getElementById('navName');
  nameEl.textContent = C.name || '店鋪名稱';
  if (!C.name) nameEl.classList.add('store-nav__name--placeholder');

  /* 導覽連結 */
  const linksEl = document.getElementById('navLinks');
  linksEl.innerHTML = (C.navLinks || []).map((l,i) =>
    `<a class="store-nav__link${i===0?' active':''}" href="${l.href}">${l.label}</a>`
  ).join('');

  /* 手機選單 */
  document.getElementById('mobileMenuPanel').innerHTML = (C.navLinks || []).map(l =>
    `<a class="mobile-menu__link" href="${l.href}" onclick="closeMobileMenu()">${l.label}</a>`
  ).join('');

  /* Hero eyebrow */
  const ey = document.getElementById('heroEyebrow');
  ey.textContent = C.name ? `${C.name} · 品質嚴選` : '';

  /* Hero tagline */
  const tl = document.getElementById('heroTagline');
  if (C.tagline) {
    tl.textContent = C.tagline;
  } else {
    tl.textContent = '請在 STORE_CONFIG.tagline 填入您的品牌標語';
    tl.classList.add('store-hero__tagline--placeholder');
  }

  /* Hero CTA */
  const ctaEl = document.getElementById('heroCta');
  ctaEl.innerHTML = `<button class="store-hero__cta-btn" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">${C.ctaPrimary || '立即選購'}</button>`;
  if (C.ctaSecondary) {
    ctaEl.innerHTML += `<button class="store-hero__cta-secondary" onclick="document.getElementById('about').scrollIntoView({behavior:'smooth'})">${C.ctaSecondary}</button>`;
  }

  /* 分類 */
  const catBar = document.getElementById('categoriesBar');
  if (C.categories && C.categories.length) {
    const allCats = ['全部', ...C.categories];
    catBar.innerHTML = allCats.map((cat, i) => {
      const val = i === 0 ? 'all' : cat;
      return `<button class="category-chip${i===0?' active':''}" onclick="filterCategory('${val}',this)">${cat}</button>`;
    }).join('');
  }

  /* 商品 */
  renderProducts();

  /* 促銷橫幅 */
  const promo = C.promo;
  if (promo && promo.enabled) {
    document.getElementById('promoBanner').classList.remove('hidden');
    document.getElementById('promoTitle').textContent = promo.title || '';
    document.getElementById('promoSub').textContent   = promo.subtitle || '';
    const btn = document.getElementById('promoBtn');
    btn.textContent = promo.btnLabel || '立即領取';
    btn.onclick = () => {

      else showToast(promo.btnAction || '已複製優惠碼', 'success');
    };
  }

  /* 頁尾品牌 */
  const fb = document.getElementById('footerBrand');
  fb.textContent = C.name || '店鋪名稱';
  if (!C.name) fb.classList.add('store-footer__brand--placeholder');
  document.getElementById('footerDesc').textContent = C.footer?.description || '';

  /* 頁尾快速連結 */
  const fl = document.getElementById('footerLinks');
  if (C.footer?.links?.length) {
    fl.innerHTML = `<div class="store-footer__col-title">快速連結</div>
      <ul class="store-footer__col-list">
        ${C.footer.links.map(l=>`<li class="store-footer__col-item"><span class="store-footer__col-dot"></span><a class="store-footer__col-link" href="${l.href}">${l.label}</a></li>`).join('')}

  const PHONE_SVG = `<svg width="36" height="36" viewBox="0 0 36 36" fill="none"><path d="M0 14C0 6.268 6.268 0 14 0h8C29.732 0 36 6.268 36 14v8C36 29.732 29.732 36 22 36h-8C6.268 36 0 29.732 0 22V14z" fill="white" fill-opacity=".1"/><path d="M24.667 21.28v2a1.334 1.334 0 01-1.454 1.333 13.19 13.19 0 01-5.753-2.047 13 13 0 01-4-4 13.19 13.19 0 01-2.047-5.78A1.334 1.334 0 0112.74 11.333h2a1.334 1.334 0 011.333 1.147c.084.64.241 1.268.467 1.873a1.334 1.334 0 01-.3 1.407l-.847.847a10.664 10.664 0 004 4l.847-.847a1.334 1.334 0 011.407-.3c.605.226 1.233.383 1.873.467a1.334 1.334 0 011.147 1.353z" stroke="white" stroke-opacity=".7" stroke-width="1.333" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  let contactHTML = `<div class="store-footer__col-title">聯絡我們</div><div class="store-footer__contact-items">`;

  contactHTML += '</div>';

  /* 版權 */
  const year = new Date().getFullYear();
  document.getElementById('footerCopyright').textContent =

  document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
  updateCartUI();
  renderAuthNav();

  localStorage.setItem('goez_store_meta', JSON.stringify({

    logoUrl: C.logoUrl || '',

})();

   結帳跳轉

function goCheckout() {
  if (!cart.length) return;
  closeCart();

/* ══════════════════════════════════
   AUTH 系統
══════════════════════════════════ */
function getUser()  { try { return JSON.parse(localStorage.getItem('goez_user') || 'null'); } catch { return null; } }
function saveUser(u){ localStorage.setItem('goez_user', JSON.stringify(u)); }
function clearUser(){ localStorage.removeItem('goez_user'); }

/* 開啟/關閉 */
function openAuth(tab='login') {
  switchTab(tab);
  document.getElementById('authOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeAuth() {
  document.getElementById('authOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
function handleAuthBg(e) { if (e.target === document.getElementById('authOverlay')) closeAuth(); }

/* Tab 切換 */
function switchTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('tabLogin').classList.toggle('active', isLogin);
  document.getElementById('tabRegister').classList.toggle('active', !isLogin);
  document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
  document.getElementById('registerForm').classList.toggle('hidden', isLogin);
}

/* 表單驗證工具 */
function setFieldError(id, hasError) {
  document.getElementById(id).classList.toggle('has-error', hasError);
}
function clearFieldErrors(...ids) { ids.forEach(id => setFieldError(id, false)); }

/* 登入 */
function submitLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  let valid = true;
  clearFieldErrors('lf-email','lf-password');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setFieldError('lf-email', true); valid = false; }
  if (!password) { setFieldError('lf-password', true); valid = false; }
  if (!valid) return;

  const btn = document.getElementById('loginSubmitBtn');
  btn.disabled = true; btn.textContent = '登入中…';
  setTimeout(() => {
    btn.disabled = false; btn.textContent = '登入';
    const name = email.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g, c=>c.toUpperCase());
    saveUser({ name, email, joinedAt: new Date().toISOString().slice(0,10) });
    closeAuth();
    renderAuthNav();
    showToast(`👋 歡迎回來，${name}！`, 'success');
  }, 800);
}

/* 註冊 */
function submitRegister(e) {
  e.preventDefault();
  const name     = document.getElementById('regName').value.trim();
  const email    = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const confirm  = document.getElementById('regConfirm').value;
  const agreed   = document.getElementById('agreeTerms').checked;
  let valid = true;
  clearFieldErrors('rf-name','rf-email','rf-password','rf-confirm');
  if (!name)  { setFieldError('rf-name', true); valid = false; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setFieldError('rf-email', true); valid = false; }
  if (password.length < 8)  { setFieldError('rf-password', true); valid = false; }
  if (password !== confirm)  { setFieldError('rf-confirm', true);  valid = false; }
  if (!agreed) { showToast('請勾選同意服務條款'); return; }
  if (!valid) return;

  const btn = document.getElementById('registerSubmitBtn');
  btn.disabled = true; btn.textContent = '建立中…';
  setTimeout(() => {
    btn.disabled = false; btn.textContent = '建立帳號';
    saveUser({ name, email, joinedAt: new Date().toISOString().slice(0,10) });
    closeAuth();
    renderAuthNav();
    showToast(`🎉 歡迎加入，${name}！`, 'success');
  }, 900);
}

/* Google 登入（示意） */
function socialLogin() {
  showToast('Google 登入功能串接中…');
}

/* 渲染 Navbar 登入狀態 */
function renderAuthNav() {
  const area = document.getElementById('navAuthArea');
  const user = getUser();
  if (!user) {
    area.innerHTML = `<button class="login-btn" onclick="openAuth('login')">登入 / 註冊</button>`;
  } else {
    const initial = user.name.charAt(0).toUpperCase();
    area.innerHTML = `
      <div class="user-btn" tabindex="0" onclick="toggleUserMenu(event)">
        <div class="user-btn__avatar" style="background:var(--c-accent)">${initial}</div>
        <span class="user-btn__name">${user.name}</span>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="user-dropdown" id="userDropdown">
          <button class="user-dropdown__item" onclick="event.stopPropagation();showToast('訂單功能即將上線')">
            📦 我的訂單
          </button>
          <button class="user-dropdown__item" onclick="event.stopPropagation();showToast('設定功能即將上線')">
            ⚙️ 帳戶設定
          </button>
          <div class="user-dropdown__divider"></div>
          <button class="user-dropdown__item user-dropdown__item--danger" onclick="event.stopPropagation();logout()">
            登出
          </button>
        </div>
      </div>`;
  }
}

function toggleUserMenu(e) {
  const dd = document.getElementById('userDropdown');
  if (dd) { dd.classList.toggle('open'); e.stopPropagation(); }
}
document.addEventListener('click', () => {
  const dd = document.getElementById('userDropdown');
  if (dd) dd.classList.remove('open');
});

function logout() {
  clearUser();
  renderAuthNav();
  showToast('已登出');
}
</script>
