<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>訂單詳情｜Goez Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Noto Sans TC', 'sans-serif'] },
          boxShadow: {
            soft: '0 2px 12px rgba(0,0,0,0.06)',
            'soft-lg': '0 4px 20px rgba(0,0,0,0.08)',
          },
        },
      },
    };
  </script>
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
    }

    .page-enter {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 320ms ease, transform 320ms ease;
    }

    .page-enter.is-entered {
      opacity: 1;
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      .page-enter {
        opacity: 1;
        transform: none;
        transition: none;
      }
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <div class="flex flex-col min-h-screen">

    <main class="flex-1">
      <div class="page-enter max-w-2xl mx-auto px-4 sm:px-6 py-8 lg:py-10">
        <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4 mb-6">
          <div>
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-900" data-i18n="orderDetailHeader">訂單詳情</h1>
            <p id="result-order-id" class="mt-1 text-sm text-slate-600"></p>
            <div id="result-badges" class="flex flex-wrap gap-2 mt-3"></div>
          </div>
          <a
            href="goez-buyerOrder.html"
            id="back-to-lookup"
            class="flex-shrink-0 px-5 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-sm font-medium hover:bg-slate-200 transition self-start text-center"
            data-i18n="backToLookupBtn"
          >
            重新查詢
          </a>
        </div>

        <div id="order-detail-body" class="space-y-4"></div>

        <div class="mt-6 flex flex-wrap justify-end gap-3">
          <button type="button" id="detail-cancel-order"
            class="hidden px-5 py-3 rounded-xl bg-slate-100 text-slate-700 font-medium hover:bg-slate-200 transition"
            data-i18n="cancelOrderBtn">取消訂單</button>
        </div>
      </div>
    </main>
  </div>

  <!-- 🌟 引入核心與訂單詳情字典檔 -->
  <script src="./i18n/i18n-core.js"></script>
  <script src="./i18n/buyerOrderDetail.js"></script>

  <script>
    (function () {
      function t(key, fallback) {
        return (window.GoezI18n && GoezI18n.t(key)) ? GoezI18n.t(key) : fallback;
      }

      function getOrderStatusLabel(os) {
        var map = {
          0: t('statusProcessing', '處理中'),
          1: t('statusPendingShipment', '待出貨'),
          2: t('statusShipped', '已出貨'),
          3: t('statusDelivered', '已送達'),
          4: t('statusPickedUp', '完成取貨'),
          5: t('statusCancelled', '已取消'),
          9: t('statusCancelled', '已取消')
        };
        return map[os] || t('statusProcessing', '處理中');
      }

      function getPaymentStatusLabel(ps) {
        var map = {
          0: t('statusUnpaid', '未付款'),
          1: t('statusPaid', '已付款'),
          2: t('statusRefunding', '退款中'),
          3: t('statusRefunded', '已退款'),
          4: t('statusPayFailed', '付款失敗')
        };
        return map[ps] || t('statusUnpaid', '未付款');
      }

      function getShipmentStatusLabel(ss) {
        var map = {
          0: t('statusPreparing', '準備中'),
          1: t('statusShipped', '已出貨'),
          2: t('statusInTransit', '配送中'),
          3: t('statusDelivered', '已送達'),
          4: t('statusReturning', '退貨中')
        };
        return map[ss] || t('statusPreparing', '準備中');
      }

      var detailBody = document.getElementById('order-detail-body');
      var resultOrderId = document.getElementById('result-order-id');
      var resultBadges = document.getElementById('result-badges');
      var cancelOrderBtn = document.getElementById('detail-cancel-order');
      var currentOrder = null;

      function parseStatus(val) {
        var n = parseInt(val, 10);
        return isNaN(n) ? val : n;
      }

      function formatMoney(n) {
        return 'NT$ ' + Number(n || 0).toLocaleString('zh-Hant', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
      }

      function formatDateTime(iso) {
        if (!iso) return '—';
        var d = new Date(iso);
        return d.getFullYear() + '/' +
          String(d.getMonth() + 1).padStart(2, '0') + '/' +
          String(d.getDate()).padStart(2, '0') + ' ' +
          String(d.getHours()).padStart(2, '0') + ':' +
          String(d.getMinutes()).padStart(2, '0');
      }

      function statusDotHtml(label, colorType) {
        var styles = {
          green: 'bg-emerald-50 text-emerald-700 border-emerald-200',
          blue: 'bg-blue-50 text-blue-700 border-blue-200',
          gray: 'bg-slate-100 text-slate-600 border-slate-200',
          amber: 'bg-amber-50 text-amber-700 border-amber-200'
        };
        var dots = {
          green: 'text-emerald-500',
          blue: 'text-blue-500',
          gray: 'text-slate-400',
          amber: 'text-amber-500'
        };

        var cls = styles[colorType] || styles.gray;
        var dotCls = dots[colorType] || dots.gray;

        return '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border ' + cls + '">' +
          '<span class="text-[10px] leading-none ' + dotCls + '">●</span> ' + label +
          '</span>';
      }

      function getOrderStatusBadge(os) {
        var label = getOrderStatusLabel(os);
        if (os === 2 || os === 3 || os === 4) return statusDotHtml(label, 'blue');
        if (os === 1) return statusDotHtml(label, 'amber');
        if (os === 5 || os === 9) return statusDotHtml(label, 'gray');
        return statusDotHtml(label, 'blue');
      }

      function getPaymentStatusBadge(ps) {
        var label = getPaymentStatusLabel(ps);
        if (ps === 1) return statusDotHtml(label, 'green');
        if (ps === 2) return statusDotHtml(label, 'amber');
        if (ps === 3) return statusDotHtml(label, 'gray');
        return statusDotHtml(label, 'gray');
      }

      function shipmentStatusLabel(order) {
        var s = order.Shipment || order.shipment;
        var ss = s ? parseStatus(s.ShippingStatus !== undefined ? s.ShippingStatus : s.ShipmentStatus) : parseStatus(order.ShippingStatus || order.ShipmentStatus);
        return getShipmentStatusLabel(ss);
      }

      function paymentRecordStatusLabel(order) {
        var p = order.Payment || order.payment;
        var ps = p ? parseStatus(p.PaymentStatus) : parseStatus(order.PaymentStatus);
        return getPaymentStatusLabel(ps);
      }

      function buildShipmentHtml(order) {
        var s = order.Shipment || order.shipment;
        var method = s ? (s.ShippingMethod || order.ShippingMethod || t('storePickup', '超商取件')) : (order.ShippingMethod || t('storePickup', '超商取件'));
        var tracking = s ? (s.TrackingNumber || '').trim() : '';
        var trackingLine = tracking
          ? '<p class="flex flex-wrap items-center gap-2"><span class="text-slate-500">' + t('trackingNumber', '物流單號：') + '</span><span class="font-mono text-slate-800 font-bold">' + tracking + '</span>' +
            '<button type="button" class="copy-tracking text-xs text-indigo-600 underline underline-offset-2 hover:text-indigo-900" data-tracking="' + tracking + '">' + t('copy', '複製') + '</button></p>'
          : '<p><span class="text-slate-500">' + t('trackingNumber', '物流單號：') + '</span>' + t('trackingPending', '處理中（尚未填寫單號）') + '</p>';
        var storeLine = (s && s.StoreInfo) ? '<p><span class="text-slate-500">' + t('storeInfo', '門市資訊：') + '</span>' + s.StoreInfo + '</p>' : '';

        return (
          '<p><span class="text-slate-500">' + t('shippingMethod', '配送方式：') + '</span>' + method + '</p>' +
          storeLine +
          trackingLine +
          '<p><span class="text-slate-500">' + t('shipmentStatus', '物流狀態：') + '</span><span class="font-medium text-slate-800">' + shipmentStatusLabel(order) + '</span></p>' +
          '<p><span class="text-slate-500">' + t('shippedAt', '出貨時間：') + '</span>' + ((s && s.ShippedAt) ? formatDateTime(s.ShippedAt) : '—') + '</p>'
        );
      }

      function buildPaymentHtml(order) {
        var p = order.Payment || order.payment;
        var method = p ? (p.PaymentMethod || t('onlinePayment', '線上支付')) : (order.PaymentMethod || t('onlinePayment', '線上支付'));
        return (
          '<p><span class="text-slate-500">' + t('paymentMethod', '付款方式：') + '</span>' + method + '</p>' +
          '<p><span class="text-slate-500">' + t('paymentStatus', '付款狀態：') + '</span><span class="font-medium text-slate-800">' + paymentRecordStatusLabel(order) + '</span></p>' +
          '<p><span class="text-slate-500">' + t('paidAt', '付款時間：') + '</span>' + ((p && p.PaidAt) ? formatDateTime(p.PaidAt) : '—') + '</p>'
        );
      }

      function sectionBlock(title, html) {
        return (
          '<section class="bg-white rounded-2xl shadow-soft border border-slate-100 overflow-hidden mb-4">' +
            '<h2 class="px-4 sm:px-5 py-3 text-sm font-semibold text-slate-800 bg-slate-50 border-b border-slate-100">' + title + '</h2>' +
            '<div class="p-4 sm:p-5 text-sm text-slate-700 space-y-2">' + html + '</div>' +
          '</section>'
        );
      }

      function renderOrder(order) {
        currentOrder = order;
        var os = parseStatus(order.OrderStatus);
        var ps = parseStatus(order.PaymentStatus);

        resultOrderId.textContent = '#' + (order.OrderID || order.id) + ' · ' + formatDateTime(order.CreatedAt);
        resultBadges.innerHTML = getOrderStatusBadge(os) + ' ' + getPaymentStatusBadge(ps);

        var discount = Number(order.DiscountValue || order.Discount || order.DiscountAmount || 0);
        var couponCode = order.CouponCode || order.Coupon || '';
        var shippingFee = Number(order.ShippingFee || 0);
        var totalAmount = Number(order.TotalAmount || 0);

        var couponDisplayHtml = '';
        if (couponCode && discount > 0) {
          couponDisplayHtml =
            '<div class="text-right">' +
              '<span class="inline-block px-2 py-0.5 rounded text-xs font-semibold bg-purple-100 text-purple-700 font-mono">' + couponCode + '</span>' +
              '<p class="text-xs text-rose-600 font-bold mt-0.5">-$' + discount.toLocaleString() + '</p>' +
            '</div>';
        } else if (discount > 0) {
          couponDisplayHtml = '<span class="text-xs text-rose-600 font-bold">-$' + discount.toLocaleString() + '</span>';
        } else {
          couponDisplayHtml = '<span class="text-xs text-slate-500 font-medium">' + t('noCoupon', '無') + '</span>';
        }

        var summaryHtml =
          '<dl class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">' +
            '<div><dt class="text-slate-500 text-xs">' + t('orderStatus', '訂單狀態') + '</dt><dd class="mt-1">' + getOrderStatusBadge(os) + '</dd></div>' +
            '<div><dt class="text-slate-500 text-xs">' + t('paymentStatus', '付款狀態') + '</dt><dd class="mt-1">' + getPaymentStatusBadge(ps) + '</dd></div>' +
            '<div><dt class="text-slate-500 text-xs">' + t('shipmentStatus', '物流狀態') + '</dt><dd class="mt-1 font-medium text-slate-800">' + shipmentStatusLabel(order) + '</dd></div>' +
            '<div><dt class="text-slate-500 text-xs">' + t('orderTime', '下單時間') + '</dt><dd class="mt-1">' + formatDateTime(order.CreatedAt) + '</dd></div>' +
          '</dl>' +
          '<div class="pt-3 border-t border-slate-100 space-y-2 text-xs text-slate-600">' +
            '<div class="flex justify-between items-center"><span>' + t('couponCode', '優惠券：') + '</span>' + couponDisplayHtml + '</div>' +
            '<div class="flex justify-between items-center"><span>' + t('shippingFee', '運費：') + '</span><span>' + formatMoney(shippingFee) + '</span></div>' +
            '<div class="flex justify-between items-center text-sm font-bold text-slate-900 pt-2 border-t border-slate-100">' +
              '<span>' + t('totalAmount', '訂單總金額：') + '</span><span class="text-indigo-600 font-mono text-base">' + formatMoney(totalAmount) + '</span>' +
            '</div>' +
          '</div>';

        var addressHtml =
          '<p><span class="text-slate-500">' + t('name', '姓名：') + '</span>' + (order.BuyerName || '—') + '</p>' +
          '<p><span class="text-slate-500">' + t('phone', '電話：') + '</span>' + (order.BuyerPhone || '—') + '</p>' +
          '<p><span class="text-slate-500">' + t('email', 'Email：') + '</span>' + (order.BuyerEmail || '—') + '</p>' +
          '<p><span class="text-slate-500">' + t('address', '地址：') + '</span>' + (order.BuyerAddress || '—') + '</p>';

        var items = order.items || order.Items || order.Orderdetails || order.OrderDetails || [];
        var itemsHtml = items.length > 0 ? items.map(function (item) {
          var qty = Number(item.Quantity || item.quantity || 1);
          var price = Number(item.UnitPrice || item.unitPrice || (item.Product ? item.Product.Price : 0));
          var sub = qty * price;
          var productObj = item.Product || {};
          // 因為 PageContent 是 hasMany，回傳會是陣列，我們抓第一筆
          var pageContents = productObj.PageContent || productObj.PageContents || [];
          var firstContent = Array.isArray(pageContents) ? pageContents[0] : pageContents;

          var name = item.ProductName || 
                     productObj.ProductName || 
                     (firstContent && firstContent.ProductName) || 
                     (item.PageContent && item.PageContent.ProductName) ||
                     '商品';
          var img = (item.ProductImg || (item.Product && item.Product.ProductImg))
            ? '<img src="' + (item.ProductImg || item.Product.ProductImg) + '" alt="" class="w-14 h-14 rounded-lg object-cover bg-slate-100 flex-shrink-0" onerror="this.style.display=\'none\'"/>'
            : '<div class="w-14 h-14 rounded-lg bg-slate-200 flex-shrink-0 flex items-center justify-center text-xs text-slate-500">商品</div>';

          return (
            '<div class="flex gap-3 py-3 border-b border-slate-100 last:border-0 items-center">' +
              img +
              '<div class="flex-1 min-w-0">' +
                '<p class="font-medium text-slate-900 truncate">' + name + '</p>' +
                '<p class="text-xs text-slate-500 mt-1">' + t('unitPrice', '單價') + ' ' + formatMoney(price) + ' × ' + qty + '</p>' +
              '</div>' +
              '<p class="font-semibold text-slate-900 flex-shrink-0">' + formatMoney(sub) + '</p>' +
            '</div>'
          );
        }).join('') : '<p class="text-slate-400 text-sm">' + t('noItems', '查無商品明細資料') + '</p>';

        detailBody.innerHTML =
          sectionBlock(t('sectionSummary', '訂單摘要與金額'), summaryHtml) +
          sectionBlock(t('sectionRecipient', '收件資訊'), addressHtml) +
          sectionBlock(t('sectionItems', '商品明細'), itemsHtml) +
          sectionBlock(t('sectionShipment', '物流資訊'), buildShipmentHtml(order)) +
          sectionBlock(t('sectionPayment', '付款資訊'), buildPaymentHtml(order));

        if (cancelOrderBtn) {
          cancelOrderBtn.classList.toggle('hidden', (os === 5 || os === 9 || os === 3 || os === 4));
        }
      }

      function fetchOrderDetail(orderId, phone) {
        var url = '/api/orders/' + encodeURIComponent(orderId);
        if (phone) {
          url += '?phone=' + encodeURIComponent(phone);
        }

        fetch(url)
          .then(function (res) {
            if (!res.ok) throw new Error('找不到該訂單或手機號碼不符');
            return res.json();
          })
          .then(function (data) {
            renderOrder(data);
          })
          .catch(function (err) {
            console.error('❌ 查詢失敗：', err);
            alert(t('cancelFail', '查無此訂單，請確認「訂單編號」與「購買人手機號碼」是否正確！'));
          });
      }

      function init() {
        if (window.GoezI18n) {
          GoezI18n.apply();
          document.title = GoezI18n.t('pageTitleBuyerOrderDetail');
        }

        var urlParams = new URLSearchParams(window.location.search);
        var orderId = urlParams.get('orderId') || urlParams.get('id') || urlParams.get('orederId') || '24';
        var phone = urlParams.get('phone');

        fetchOrderDetail(orderId, phone);

        requestAnimationFrame(function () {
          var pageEnter = document.querySelector('.page-enter');
          if (pageEnter) pageEnter.classList.add('is-entered');
        });
      }

      if (cancelOrderBtn) {
        cancelOrderBtn.addEventListener('click', function () {
          if (!currentOrder) return;
          var confirmText = t('confirmCancel', '您確定要取消訂單 #{orderId} 嗎？').replace('{orderId}', (currentOrder.OrderID || currentOrder.id));
          if (!confirm(confirmText)) return;

          fetch('/api/orders/' + (currentOrder.OrderID || currentOrder.id) + '/cancel', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' }
          })
          .then(function (res) {
            if (!res.ok) throw new Error('取消訂單失敗');
            return res.json();
          })
          .then(function (data) {
            alert(t('cancelSuccess', '訂單已成功取消！'));
            fetchOrderDetail(currentOrder.OrderID || currentOrder.id);
          })
          .catch(function (err) {
            console.error('❌ 取消失敗：', err);
            alert(t('cancelFail', '取消訂單發生錯誤，請檢查後端伺服器！'));
          });
        });
      }

      // ==========================================
      // ✨ 讓返回查詢頁的按鈕，自動帶上原本的 from 參數接力回查詢頁
      // ==========================================
      var backBtn = document.getElementById('back-to-lookup');
      if (backBtn) {
        backBtn.addEventListener('click', function (e) {
          e.preventDefault();
          
          // 1. 抓取當前詳情頁網址帶有的 from 參數
          var currentParams = new URLSearchParams(window.location.search);
          var storeFrom = currentParams.get('from');

          // 2. 組合返回查詢頁的網址
          var lookupUrl = 'goez-buyerOrder.html';
          if (storeFrom) {
            lookupUrl += '?from=' + encodeURIComponent(storeFrom);
          }

          // 3. 執行跳轉
          window.location.href = lookupUrl;
        });
      }

      detailBody.addEventListener('click', function (e) {
        var copyBtn = e.target.closest('.copy-tracking');
        if (!copyBtn) return;
        var text = copyBtn.getAttribute('data-tracking');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            alert(t('copiedMsg', '物流單號已複製！'));
          });
        }
      });

      detailBody.addEventListener('click', function (e) {
        var copyBtn = e.target.closest('.copy-tracking');
        if (!copyBtn) return;
        var text = copyBtn.getAttribute('data-tracking');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            alert(t('copiedMsg', '物流單號已複製！'));
          });
        }
      });

      init();
    })();
  </script>
</body>
</html>
