<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>查詢訂單｜Goez Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Noto Sans TC', 'sans-serif'] },
          boxShadow: {
            soft: '0 2px 12px rgba(0,0,0,0.06)',
            'soft-lg': '0 4px 20px rgba(0,0,0,0.08)',
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
    .page-enter {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 320ms ease, transform 320ms ease;
    }
    .page-enter.is-entered {
      opacity: 1;
      transform: translateY(0);
    }
    @media (prefers-reduced-motion: reduce) {
      .page-enter { opacity: 1; transform: none; transition: none; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <div class="flex flex-col min-h-screen">
    <header class="flex-shrink-0 bg-gradient-to-r from-slate-200 via-slate-100 to-blue-100/80 backdrop-blur-sm">
      <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16 gap-3">
          <a href="../sign-up/index.html" class="flex items-center gap-2">
            <span class="text-xl font-bold text-slate-800 tracking-tight">Goez Shop</span>
          </a>
          <div class="flex items-center gap-3">
            <label for="lang-switch" class="sr-only" data-i18n="language">語言</label>
            <select
              id="lang-switch"
              class="text-sm rounded-xl border border-slate-200 bg-white/80 px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-200"
            ></select>
            <div class="w-9 h-9 rounded-full bg-slate-300 flex items-center justify-center text-slate-600" role="img" data-i18n-aria="buyerCenter" aria-label="買家中心">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="flex-1">
      <div class="page-enter max-w-lg mx-auto px-4 sm:px-6 py-8 lg:py-12">
        <div class="text-center mb-8">
          <h1 class="text-2xl sm:text-3xl font-bold text-slate-900" data-i18n="lookupTitle">查詢訂單</h1>
          <p class="mt-2 text-sm text-slate-600" data-i18n="lookupRange">可查詢區間：6 個月內</p>
        </div>

        <section class="bg-white rounded-2xl shadow-soft border border-slate-100 p-6 sm:p-8">
          <form id="order-lookup-form" class="space-y-5" novalidate>
            <div>
              <label for="lookup-order-id" class="block text-sm font-medium text-slate-700 mb-1.5">
                <span data-i18n="orderId">訂單編號</span>
                <span class="text-rose-600 text-xs font-normal" data-i18n="required">必填</span>
              </label>
              <input
                type="text"
                id="lookup-order-id"
                inputmode="numeric"
                required
                data-i18n-placeholder="orderIdPlaceholder"
                placeholder="例：10086"
                class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:border-slate-300 focus:ring-2 focus:ring-slate-200 focus:outline-none text-slate-800 placeholder-slate-400 transition"
              />
            </div>

            <div>
              <label for="lookup-phone" class="block text-sm font-medium text-slate-700 mb-1.5">
                <span data-i18n="phone">聯絡電話</span>
                <span class="text-rose-600 text-xs font-normal" data-i18n="required">必填</span>
              </label>
              <input
                type="tel"
                id="lookup-phone"
                required
                placeholder="+886912345678"
                class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:border-slate-300 focus:ring-2 focus:ring-slate-200 focus:outline-none text-slate-800 placeholder-slate-400 transition"
              />
              <p class="mt-2 text-xs text-slate-500" data-i18n="phoneHint">請輸入下單時填寫的聯絡電話。</p>
            </div>

            <div id="lookup-error" class="hidden p-3 rounded-xl border border-red-200 bg-red-50 text-red-700 text-sm" role="alert"></div>

            <button
              type="submit"
              class="w-full px-5 py-3.5 rounded-xl bg-slate-800 text-white font-medium shadow-soft hover:bg-slate-900 transition"
              data-i18n="search"
            >
              查詢
            </button>
          </form>
        </section>

        <div class="mt-6 space-y-3">
          <p class="text-sm font-medium text-slate-800" data-i18n="demoOrders">示範訂單</p>
          <div class="rounded-xl border border-dashed border-slate-300 bg-white/80 p-4 sm:p-5">
            <p class="text-sm font-medium text-slate-800" data-i18n="demoDone">訂單已完成</p>
            <p class="mt-1 text-xs text-slate-600 leading-relaxed">
              <span data-i18n="orderId">訂單編號</span>
              <span class="font-mono font-medium text-slate-800">10032</span> ·
              <span data-i18n="phone">電話</span>
              <span class="font-mono font-medium text-slate-800">+886912345678</span>
            </p>
          </div>
          <div class="rounded-xl border border-dashed border-slate-300 bg-white/80 p-4 sm:p-5">
            <p class="text-sm font-medium text-slate-800" data-i18n="demoUnpaid">未付款</p>
            <p class="mt-1 text-xs text-slate-600 leading-relaxed">
              <span data-i18n="orderId">訂單編號</span>
              <span class="font-mono font-medium text-slate-800">10041</span> ·
              <span data-i18n="phone">電話</span>
              <span class="font-mono font-medium text-slate-800">+886912345678</span>
            </p>
          </div>
          <div class="rounded-xl border border-dashed border-slate-300 bg-white/80 p-4 sm:p-5">
            <p class="text-sm font-medium text-slate-800" data-i18n="demoShipping">待出貨</p>
            <p class="mt-1 text-xs text-slate-600 leading-relaxed">
              <span data-i18n="orderId">訂單編號</span>
              <span class="font-mono font-medium text-slate-800">10086</span> ·
              <span data-i18n="phone">電話</span>
              <span class="font-mono font-medium text-slate-800">+886912345678</span>
            </p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../i18n-core.js"></script>
  <script src="./i18n.js"></script>
  <script src="./demo-orders.js"></script>
  <script>
    (function () {
      var form = document.getElementById('order-lookup-form');
      var orderIdInput = document.getElementById('lookup-order-id');
      var phoneInput = document.getElementById('lookup-phone');
      var lookupError = document.getElementById('lookup-error');

      function showLookupError(msg) {
        lookupError.textContent = msg;
        lookupError.classList.remove('hidden');
      }
      function clearLookupError() {
        lookupError.textContent = '';
        lookupError.classList.add('hidden');
      }

      function refreshPageTitle() {
        document.title = GoezI18n.t('pageTitleLookup');
      }

      function goToDetail(order) {
        GoezBuyerOrders.saveOrderForDetail(order);
        window.location.href = 'order-detail.html';
      }

      function submitLookup() {
        clearLookupError();
        var result = GoezBuyerOrders.lookupOrder(orderIdInput.value, phoneInput.value);
        if (result.errorKey) {
          showLookupError(GoezI18n.t(result.errorKey));
          return;
        }
        goToDetail(result.order);
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        submitLookup();
      });

      GoezI18n.mountSwitcher(document.getElementById('lang-switch'), function () {
        refreshPageTitle();
        clearLookupError();
      });
      GoezI18n.apply();
      refreshPageTitle();

      if (new URLSearchParams(window.location.search).get('demo') === '1') {
        orderIdInput.value = String(GoezBuyerOrders.DEMO_ORDER_ID);
        phoneInput.value = GoezBuyerOrders.DEMO_ORDER_PHONE;
        submitLookup();
      }

      requestAnimationFrame(function () {
        document.querySelector('.page-enter').classList.add('is-entered');
      });
    })();
  </script>
</body>
</html>
