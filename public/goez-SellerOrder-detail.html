<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單明細</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                screens: {
                    'md': '800px',
                    'xl': '1280px',
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 頁首 Header -->
    <header class="bg-white border-b border-gray-200 px-4 md:px-6 py-3 md:py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-2.5">
            <i class="fa-solid fa-bag-shopping text-indigo-600 text-xl md:text-2xl"></i>
            <span class="font-bold text-gray-900 text-lg md:text-xl tracking-tight">goezshop</span>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 p-3 md:p-6 xl:p-8">
        <div class="max-w-[1200px] mx-auto">
            
            <!-- Header Section -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <div class="flex items-center gap-4">
                    <!-- 修改處：改用 id="backBtn" 讓 JS 動態抓取 sellerId 帶回列表頁 -->
                    <a href="goez-SellerOrder.html" id="backBtn" class="w-10 h-10 rounded-full bg-white border border-gray-200 flex items-center justify-center text-gray-500 hover:text-indigo-600 hover:border-indigo-200 hover:shadow-sm transition-all shadow-sm" title="返回訂單管理">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <h1 class="text-2xl font-bold text-gray-800 tracking-tight">訂單明細</h1>
                </div>
            </div>

            <!-- 訂單資訊摘要卡片 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 mb-6 flex flex-wrap gap-x-12 gap-y-4 text-sm">
                <div>
                    <span class="text-gray-500 block mb-1">所屬訂單編號</span>
                    <span id="summary-order-id" class="font-semibold text-gray-800 text-lg">-</span>
                </div>
                <div>
                    <span class="text-gray-500 block mb-1">明細項目總數</span>
                    <span id="summary-total-items" class="font-semibold text-gray-800 text-lg">0 件</span>
                </div>
            </div>

            <!-- Main Card Container -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                
                <!-- Table Container -->
                <div class="overflow-x-auto custom-scrollbar">
                    <table class="w-full text-sm text-left whitespace-nowrap">
                        <thead class="text-xs text-gray-600 uppercase bg-gray-100/80">
                            <tr>
                                <th scope="col" class="px-6 py-4 font-semibold border-b border-gray-200">明細編號</th>
                                <th scope="col" class="px-6 py-4 font-semibold border-b border-gray-200">所屬訂單</th>
                                <th scope="col" class="px-6 py-4 font-semibold border-b border-gray-200">對應商品</th>
                                <th scope="col" class="px-6 py-4 font-semibold text-right border-b border-gray-200">購買數量</th>
                                <th scope="col" class="px-6 py-4 font-semibold text-right border-b border-gray-200">成交單價</th>
                                <th scope="col" class="px-6 py-4 font-semibold text-right text-gray-800 border-b border-gray-200">小計</th>
                            </tr>
                        </thead>
                        <tbody id="detail-table-body" class="divide-y divide-gray-100 bg-white">
                            <!-- Table rows will be populated by JavaScript -->
                        </tbody>
                        <tfoot class="bg-gray-50/50">
                            <tr>
                                <td colspan="5" class="px-6 py-4 text-right font-medium text-gray-600 border-t border-gray-200">總計金額：</td>
                                <td id="table-grand-total" class="px-6 py-4 text-right font-bold text-lg text-slate-700 border-t border-gray-200">NT$ 0</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const formatter = new Intl.NumberFormat('zh-TW', {
            style: 'currency',
            currency: 'TWD',
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        });

        document.addEventListener('DOMContentLoaded', () => {
            // 自動動態處理返回按鈕的連結，保留 sellerId
            const urlParams = new URLSearchParams(window.location.search);
            const sellerId = urlParams.get('sellerId');
            const backBtn = document.getElementById('backBtn');
            if (sellerId && backBtn) {
                backBtn.href = `goez-SellerOrder.html?sellerId=${sellerId}`;
            }

            fetchOrderDetails();
        });

        async function fetchOrderDetails() {
            const tbody = document.getElementById('detail-table-body');
            tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-gray-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i>明細載入中...</td></tr>`;

            try {
                const urlParams = new URLSearchParams(window.location.search);
                const orderId = urlParams.get('orderid') || urlParams.get('orderId') || '';
                
                if (orderId) {
                    const response = await fetch(`/api/orders/${orderId}/details`);
                    const orderData = await response.json();
                    
                    const details = orderData.Orderdetails || orderData.orderdetails || orderData.details;

                    if (orderData && details && Array.isArray(details) && details.length > 0) {
                        renderDetailTable(orderData.OrderID || orderId, details);
                    } else {
                        showNoDataMessage(orderId);
                    }
                } else {
                    showNoDataMessage('');
                }

            } catch (error) {
                console.error('前端抓取訂單明細發生錯誤:', error);
                showNoDataMessage('');
            }
        }

        function showNoDataMessage(orderId) {
            const tbody = document.getElementById('detail-table-body');
            if (tbody) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-12 text-center text-gray-500 bg-gray-50/50">
                            <div class="flex flex-col items-center justify-center">
                                <i class="fa-solid fa-box-open text-3xl text-gray-300 mb-3"></i>
                                <p>目前尚無明細資料</p>
                            </div>
                        </td>
                    </tr>
                `;
            }
            document.getElementById('summary-order-id').innerText = orderId ? `#${orderId}` : '-';
            document.getElementById('summary-total-items').innerText = '0 件';
            document.getElementById('table-grand-total').innerText = formatter.format(0);
        }

        function renderDetailTable(orderId, details) {
            const tbody = document.getElementById('detail-table-body');
            tbody.innerHTML = '';
            
            let grandTotal = 0;

            details.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50/80 transition-colors group';
                
                const quantity = item.Quantity || 0;
                const unitPrice = item.UnitPrice || 0;
                const subtotal = quantity * unitPrice;
                grandTotal += subtotal;

                const product = item.Product || item.product || {};
                const productName = product.ProductName || product.productName || `商品 ID: ${item.ProductID}`;
                const productImage = product.ProductImage || product.productImage || 'https://via.placeholder.com/40';

                tr.innerHTML = `
                    <td class="px-6 py-4 text-gray-500">#${item.OrderdetailID || '-'}</td>
                    <td class="px-6 py-4 font-medium text-gray-900">#${orderId || '-'}</td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <img src="${productImage}" alt="" class="w-10 h-10 object-cover rounded-lg border border-gray-200 bg-gray-50" onerror="this.src='https://via.placeholder.com/40'">
                            <span class="text-slate-700 font-medium">${productName}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-right font-mono">${quantity}</td>
                    <td class="px-6 py-4 text-right text-gray-600">${formatter.format(unitPrice)}</td>
                    <td class="px-6 py-4 text-right font-semibold text-gray-800">${formatter.format(subtotal)}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('summary-order-id').innerText = `#${orderId}`;
            document.getElementById('summary-total-items').innerText = `${details.length} 件`;
            document.getElementById('table-grand-total').innerText = formatter.format(grandTotal);
        }
    </script>
</body>
</html>
