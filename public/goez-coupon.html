<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增優惠券 - goezshop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                screens: {
                    'md': '800px',
                    'lg': '1280px',
                },
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        appbg: '#F3F6F9',
                        logo: '#5B4EFA',
                        btn: {
                            DEFAULT: '#334155',
                            hover: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: theme('colors.appbg');
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        .custom-checkbox:checked {
            background-color: theme('colors.logo');
            border-color: theme('colors.logo');
        }
    </style>
</head>

<body class="text-slate-800 antialiased min-h-screen pb-20">

    <header class="bg-white h-16 flex items-center px-6 sticky top-0 z-20 border-b border-slate-200">
        <div class="flex items-center gap-2 font-bold text-xl tracking-tight text-slate-900">
            <svg class="w-6 h-6 text-logo" viewBox="0 0 24 24" fill="currentColor">
                <path
                    d="M19 6h-2c0-2.8-2.2-5-5-5S7 3.2 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.7 0 3 1.3 3 3H9c0-1.7 1.3-3 3-3zm7 17H5V8h14v12z" />
                <circle cx="9" cy="10" r="1.5" />
                <circle cx="15" cy="10" r="1.5" />
            </svg>
            goezshop
        </div>
    </header>

    <main class="w-full max-w-[1200px] mx-auto px-4 md:px-8 lg:px-12 py-8">

        <div class="mb-8">
            <h1 class="text-2xl font-bold text-slate-900" data-i18n="pageHeadingCoupon">新增優惠券</h1>
        </div>

        <form id="couponForm">

            <!-- 區塊 1：優惠券基本設定 -->
            <section
                class="bg-white rounded-2xl border border-slate-200 p-6 md:p-8 lg:p-10 mb-6 flex flex-col md:flex-row gap-6 md:gap-8 lg:gap-12 items-start shadow-sm">
                <div class="w-full md:w-1/3 flex-shrink-0 md:max-w-[260px] lg:max-w-[320px]">
                    <h2 class="text-lg md:text-xl font-bold text-slate-900" data-i18n="sectionCouponBasic">優惠券</h2>
                    <p class="text-sm text-slate-500 mt-2 md:mt-3 leading-relaxed">
                        <span data-i18n="couponBasicDesc">建議6個字以下，使用「數字」「全大寫英文」「全大寫英文＋數字」。</span>
                        <span class="text-slate-400 text-xs mt-1 block" data-i18n="couponBasicHint">* 應避免出現容易混淆的字，例：數字 1
                            英文小寫 l</span>
                    </p>
                </div>

                <div class="w-full md:w-2/3 flex-grow flex flex-col gap-6">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <label for="coupon-name" class="block text-sm font-medium text-slate-700"
                                data-i18n="couponNameLabel">名稱</label>
                            <span class="text-red-500 text-xs font-medium" data-i18n="requiredTag">必填</span>
                        </div>
                        <input type="text" id="coupon-name" placeholder="例如：2026年終優惠"
                            data-i18n-placeholder="couponNamePlaceholder" required
                            class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-400 focus:border-slate-400 transition-colors placeholder:text-slate-300">
                    </div>

                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <label for="coupon-code" class="block text-sm font-medium text-slate-700"
                                data-i18n="couponCodeLabel">代碼</label>
                            <span class="text-red-500 text-xs font-medium" data-i18n="requiredTag">必填</span>
                        </div>
                        <input type="text" id="coupon-code" placeholder="例如：SAVE2026"
                            data-i18n-placeholder="couponCodePlaceholder" required
                            class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-400 focus:border-slate-400 transition-colors placeholder:text-slate-300">
                    </div>
                </div>
            </section>

            <!-- 區塊 2：折扣類型 -->
            <section
                class="bg-white rounded-2xl border border-slate-200 p-6 md:p-8 lg:p-10 mb-6 flex flex-col md:flex-row gap-6 md:gap-8 lg:gap-12 items-start shadow-sm">
                <div class="w-full md:w-1/3 flex-shrink-0 md:max-w-[260px] lg:max-w-[320px]">
                    <h2 class="text-lg md:text-xl font-bold text-slate-900" data-i18n="sectionDiscountType">折扣類型</h2>
                    <p class="text-sm text-slate-500 mt-2 md:mt-3 leading-relaxed">
                        <span class="block" data-i18n="discountTypeDesc1">可設定滿1000元9折，滿2000元8折。</span>
                        <span class="block mt-0.5" data-i18n="discountTypeDesc2">滿1000元折100，滿2000元折200...等等。</span>
                    </p>
                </div>

                <div class="w-full md:w-2/3 flex-grow flex flex-col gap-6">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <label for="discount-type" class="block text-sm font-medium text-slate-700"
                                data-i18n="discountTypeLabel">折扣種類</label>
                            <span class="text-red-500 text-xs font-medium" data-i18n="requiredTag">必填</span>
                        </div>
                        <div class="relative">
                            <select id="discount-type" required
                                class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-slate-900 appearance-none bg-white focus:outline-none focus:ring-1 focus:ring-slate-400 focus:border-slate-400 transition-colors">
                                <option value="" disabled selected data-i18n="discountTypeSelectDefault">請選擇種類</option>
                                <option value="fixed" data-i18n="discountTypeFixed">固定</option>
                                <option value="percentage" data-i18n="discountTypePercentage">百分比</option>
                            </select>
                            <div
                                class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- 單一規則輸入區（對應資料庫欄位 MinSpend 與 DiscountValue） -->
                    <div id="discount-rules-wrapper" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4 mt-2 pt-4 border-t border-slate-100">
                    <div>
                        <div class="flex items-center gap-1 mb-2">
                            <label for="min-spend" class="block text-sm font-medium text-slate-700" data-i18n="ruleSpendMinLabel">金額滿X元</label>
                            <span class="text-red-500 text-xs font-bold">*</span>
                        </div>
                        <input type="number" id="min-spend" min="0" placeholder="0" required
                            class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-400 focus:border-slate-400 transition-colors placeholder:text-slate-300">
                        </div>
                        <div>
                            <div class="flex items-center gap-1 mb-2">
                                <label for="discount-value" id="discount-value-label" class="block text-sm font-medium text-slate-700">折扣金額</label>
                                <span class="text-red-500 text-xs font-bold">*</span>
                            </div>
                            <input type="number" id="discount-value" min="0" step="0.01" placeholder="100" required
                                class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-400 focus:border-slate-400 transition-colors placeholder:text-slate-300">
                        </div>
                    </div>
            </section>

            <!-- 區塊 3：使用限制 -->
            <section
                class="bg-white rounded-2xl border border-slate-200 p-6 md:p-8 lg:p-10 mb-6 flex flex-col md:flex-row gap-6 md:gap-8 lg:gap-12 items-start shadow-sm">
                <div class="w-full md:w-1/3 flex-shrink-0 md:max-w-[260px] lg:max-w-[320px]">
                    <h2 class="text-lg md:text-xl font-bold text-slate-900" data-i18n="sectionUsageLimits">使用限制</h2>
                    <p class="text-sm text-slate-500 mt-2 md:mt-3 leading-relaxed" data-i18n="usageLimitsDesc">
                        設置優惠券的發放數量與使用條件限制。
                    </p>
                </div>

                <div class="w-full md:w-2/3 flex-grow flex flex-col gap-6">
                    <div>
                        <label for="limit-uses" class="block text-sm font-medium text-slate-700 mb-2"
                            data-i18n="limitUsesLabel">使用次數上限</label>
                        <div class="relative">
                            <input type="number" id="limit-uses" placeholder="不限制" min="1"
                                data-i18n-placeholder="noLimitPlaceholder"
                                class="w-full border border-slate-300 rounded-lg pl-4 pr-10 py-2.5 text-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-400 focus:border-slate-400 transition-colors placeholder:text-slate-300">
                            <span
                                class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 pointer-events-none text-sm font-medium"
                                data-i18n="unitTimes">次</span>
                        </div>
                    </div>

                    <div>
                        <label for="total-issue" class="block text-sm font-medium text-slate-700 mb-2"
                            data-i18n="totalIssueLabel">總發行量</label>
                        <div class="relative">
                            <input type="number" id="total-issue" placeholder="不限制" min="1"
                                data-i18n-placeholder="noLimitPlaceholder"
                                class="w-full border border-slate-300 rounded-lg pl-4 pr-10 py-2.5 text-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-400 focus:border-slate-400 transition-colors placeholder:text-slate-300">
                            <span
                                class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 pointer-events-none text-sm font-medium"
                                data-i18n="unitTickets">張</span>
                        </div>
                    </div>

                    <div class="pt-1">
                        <label class="inline-flex items-center cursor-pointer group">
                            <input type="checkbox" id="no-combine"
                                class="custom-checkbox w-5 h-5 rounded border-slate-300 text-logo focus:ring-slate-400 cursor-pointer transition-colors">
                            <span class="ml-3 text-sm text-slate-700 group-hover:text-slate-900"
                                data-i18n="noCombineLabel">不可與其他優惠券並用</span>
                        </label>
                    </div>
                </div>
            </section>

            <!-- 區塊 4：時間限制 -->
            <section
                class="bg-white rounded-2xl border border-slate-200 p-6 md:p-8 lg:p-10 mb-8 flex flex-col md:flex-row gap-6 md:gap-8 lg:gap-12 items-start shadow-sm">
                <div class="w-full md:w-1/3 flex-shrink-0 md:max-w-[260px] lg:max-w-[320px]">
                    <h2 class="text-lg md:text-xl font-bold text-slate-900" data-i18n="sectionTimeLimit">時間限制</h2>
                    <p class="text-sm text-slate-500 mt-2 md:mt-3 leading-relaxed" data-i18n="timeLimitDesc">
                        設定此優惠券可被使用的有效期限。
                    </p>
                </div>

                <div class="w-full md:w-2/3 flex-grow flex flex-col gap-6">
                    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                        <div>
                            <label for="start-date" class="block text-sm font-medium text-slate-700 mb-2"
                                data-i18n="startDateLabel">開始時間</label>
                            <input type="date" id="start-date" value="2026-01-01"
                                class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-400 focus:border-slate-400 transition-colors disabled:bg-slate-100 disabled:text-slate-400 disabled:border-slate-200 disabled:cursor-not-allowed">
                        </div>
                        <div>
                            <label for="end-date" class="block text-sm font-medium text-slate-700 mb-2"
                                data-i18n="endDateLabel">結束時間</label>
                            <input type="date" id="end-date" value="2026-12-01"
                                class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-400 focus:border-slate-400 transition-colors disabled:bg-slate-100 disabled:text-slate-400 disabled:border-slate-200 disabled:cursor-not-allowed">
                        </div>
                    </div>

                    <div class="pt-1">
                        <label class="inline-flex items-center cursor-pointer group">
                            <input type="checkbox" id="no-time-limit"
                                class="custom-checkbox w-5 h-5 rounded border-slate-300 text-logo focus:ring-slate-400 cursor-pointer transition-colors">
                            <span class="ml-3 text-sm text-slate-700 group-hover:text-slate-900"
                                data-i18n="noTimeLimitLabel">無時間限制</span>
                        </label>
                    </div>
                </div>
            </section>

            <!-- 操作按鈕 -->
            <div class="flex flex-row-reverse items-center gap-4 pt-2">
                <button type="submit"
                    class="px-8 py-2.5 rounded-lg border border-transparent text-white bg-btn hover:bg-btn-hover font-medium shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-500"
                    data-i18n="btnSaveSettings">
                    儲存設定
                </button>
                <button type="button" onclick="history.back()"
                    class="px-8 py-2.5 rounded-lg border border-slate-300 text-slate-700 bg-white hover:bg-slate-50 font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-200"
                    data-i18n="btnCancel">
                    取消
                </button>
            </div>

        </form>
    </main>


    <script>
        function t(key, fallback) {
            return (window.GoezI18n && GoezI18n.t(key)) ? GoezI18n.t(key) : fallback;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const discountTypeSelect = document.getElementById('discount-type');
            const rulesWrapper = document.getElementById('discount-rules-wrapper');
            const discountValueLabel = document.getElementById('discount-value-label');
            const discountValueInput = document.getElementById('discount-value');

            // 監聽折扣種類切換，動態改變提示文字
            discountTypeSelect.addEventListener('change', () => {
                const type = discountTypeSelect.value;
                if (type) {
                    rulesWrapper.classList.remove('hidden');
                    if (type === 'percentage') {
                        discountValueLabel.textContent = t('rulePercentLabel', '折扣百分比 例：10%請寫0.1');
                        discountValueInput.placeholder = '0.1';
                    } else {
                        discountValueLabel.textContent = t('ruleFixedLabel', '折扣金額 100元請填100');
                        discountValueInput.placeholder = '100';
                    }
                } else {
                    rulesWrapper.classList.add('hidden');
                }
            });

            const noTimeLimitCheckbox = document.getElementById('no-time-limit');
            const startDateInput = document.getElementById('start-date');
            const endDateInput = document.getElementById('end-date');

            noTimeLimitCheckbox.addEventListener('change', (e) => {
                const isChecked = e.target.checked;

                startDateInput.disabled = isChecked;
                endDateInput.disabled = isChecked;

                const noLimitText = t('noLimitPlaceholder', '不限制');

                if (isChecked) {
                    startDateInput.type = "text";
                    startDateInput.value = noLimitText;
                    endDateInput.type = "text";
                    endDateInput.value = noLimitText;
                } else {
                    startDateInput.type = "date";
                    startDateInput.value = "2026-01-01";
                    endDateInput.type = "date";
                    endDateInput.value = "2026-12-01";
                }
            });

            const form = document.getElementById('couponForm');
            form.addEventListener('submit', (e) => {
                e.preventDefault();

                const submitBtn = form.querySelector('button[type="submit"]');
                const originalText = submitBtn.textContent;

                submitBtn.textContent = t('statusProcessing', '處理中...');
                submitBtn.classList.add('opacity-80', 'cursor-not-allowed');

                setTimeout(() => {
                    submitBtn.textContent = t('statusSuccess', '建立成功 ✓');
                    submitBtn.classList.remove('bg-btn', 'hover:bg-btn-hover');
                    submitBtn.classList.add('bg-green-600', 'hover:bg-green-700');

                    setTimeout(() => {
                        submitBtn.textContent = originalText;
                        submitBtn.classList.remove('opacity-80', 'cursor-not-allowed', 'bg-green-600', 'hover:bg-green-700');
                        submitBtn.classList.add('bg-btn', 'hover:bg-btn-hover');
                    }, 2000);
                }, 800);
            });
        });
    </script>
    <script src="./js/coupon-manage.js"></script>

    <!-- 🌟 底部引入核心與專屬字典檔，並自動套用記憶 -->
    <script src="./i18n/i18n-core.js"></script>
    <script src="./i18n/coupon.js"></script>
    <script>
        if (window.GoezI18n) {
            GoezI18n.apply();
            document.title = GoezI18n.t('pageTitleCoupon');
        }
    </script>


</body>

</html>
